<title>Take Up Space</title>


<style>

/* =========================================================
   BASIC
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  overflow:hidden;
  background:#192142;
}



/* =========================================================
   ENTRY PAGE
   ========================================================= */

#entry{

  position:relative;

  z-index:20;

  width:100%;

  min-height:100vh;
  min-height:100dvh;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:30px;

  background:#192142;

  color:#677AC5;

  transition:
    opacity 1.2s ease,
    visibility 1.2s ease;
}


#entry.hidden{

  opacity:0;

  visibility:hidden;

  pointer-events:none;

}


.entry-inner{

  width:min(
    720px,
    100%
  );

}


h1{

  font-size:
    clamp(
      38px,
      7vw,
      76px
    );

  font-weight:400;

  line-height:.92;

  letter-spacing:-.055em;

  margin:
    0 0 22px;

  max-width:700px;

}


.intro{

  font-size:18px;

  line-height:1.45;

  max-width:580px;

  margin:
    0 0 28px;

}


textarea{

  width:100%;

  min-height:190px;

  resize:vertical;

  border:
    1px solid #677AC5;

  background:#192142;

  color:#677AC5;

  padding:18px;

  font:inherit;

  font-size:19px;

  line-height:1.35;

  outline:none;
}


textarea::placeholder{

  color:#677AC5;

  opacity:.55;

}


textarea:focus{

  box-shadow:
    0 0 0 2px #677AC5;

}


.entry-bottom{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:16px;

  margin-top:14px;

}


button{

  border:0;

  background:#677AC5;

  color:#192142;

  padding:
    15px 25px;

  min-height:50px;

  font:inherit;

  cursor:pointer;

}


button:disabled{

  opacity:.45;

  cursor:default;

}


#status{

  font-size:14px;

  min-height:20px;

}


#enterSpace{

  margin-top:14px;

  background:transparent;

  border:
    1px solid #677AC5;

  color:#677AC5;

  padding:
    12px 18px;

  font-size:14px;

}


#enterSpace:hover{

  background:#677AC5;

  color:#192142;

}



/* =========================================================
   SHARED SPACE
   ========================================================= */

#space{

  position:absolute;

  inset:0;

  width:100%;
  height:100dvh;

  overflow:hidden;

  background:#192142;

  opacity:0;

  pointer-events:none;

  transition:
    opacity 1.5s ease;
}


#space.visible{

  opacity:1;

  pointer-events:auto;

}



/* =========================================================
   VIDEO
   ========================================================= */

#backgroundVideo{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:0;

  opacity:.72;

  filter:
    blur(1px);

  transform:
    scale(1.015);

  pointer-events:none;

}



/* =========================================================
   VIDEO OVERLAY
   ========================================================= */

#videoOverlay{

  position:absolute;

  inset:0;

  z-index:1;

  background:
    rgba(
      25,
      33,
      66,
      .58
    );

  pointer-events:none;

}



/* =========================================================
   CONFESSIONS
   ========================================================= */

.word{

  position:absolute;

  left:0;
  top:0;

  z-index:5;

  color:#677AC5;

  font-size:
    clamp(
      22px,
      2vw,
      38px
    );

  line-height:1.05;

  font-weight:400;

  letter-spacing:-.035em;

  white-space:normal;

  width:max-content;

  max-width:min(
    38vw,
    620px
  );

  opacity:0;

  pointer-events:none;

  will-change:
    transform,
    opacity;

  transform-origin:
    top left;

}



/* =========================================================
   NAVIGATION
   ========================================================= */

#back{

  position:absolute;

  z-index:30;

  top:
    calc(
      20px +
      env(safe-area-inset-top)
    );

  left:
    calc(
      20px +
      env(safe-area-inset-left)
    );

  border:
    1px solid
    rgba(
      103,
      122,
      197,
      .45
    );

  background:
    rgba(
      25,
      33,
      66,
      .72
    );

  color:#677AC5;

  padding:
    10px 14px;

  font-size:13px;

  opacity:.7;
}


#back:hover{

  opacity:1;

}



/* =========================================================
   EMPTY STATE
   ========================================================= */

#empty{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#677AC5;

  font-size:15px;

  opacity:.6;

}



/* =========================================================
   MODERATION
   ========================================================= */

#moderate{

  position:absolute;

  z-index:50;

  top:
    calc(
      20px +
      env(safe-area-inset-top)
    );

  right:
    calc(
      20px +
      env(safe-area-inset-right)
    );

    1px solid
    rgba(
      103,
      122,
      197,
      .45
    );

  background:
    rgba(
      25,
      33,
      66,
      .72
    );

  padding:

}



/* =========================================================
   MODERATION PANEL
   ========================================================= */

#moderationPanel{

    calc(

    );

  right:
    calc(
      20px +

    );

#loginButton,

/* =========================================================

function startVideo(){

  backgroundVideo.volume =

  const playPromise =

/* =========================================================
   MODERATION
   ========================================================= */

const ADMIN_PIN =
  "0092";


let adminUnlocked =
  false;


let selectedId =
  null;



/* =========================================================
   PROJECTION SETTINGS
   ========================================================= */

function getVisibleCount(){

  const width =
    window.innerWidth;


  /*
    Phones:

    Only FOUR confession blocks
    are active at one time.

    All submissions still cycle
    through the projection.
  */

  if(
    width <= 600
  ){

    return 4;

  }


  /*
    Tablets.
  */

  if(
    width <= 1000
  ){

    return 7;

  }


  /*
    Desktop/projector.
  */

  return 12;

}


/*
  Every active confession moves
  at exactly the same speed.

  This preserves their spacing.
*/

const FALL_SPEED =
  0.018;


/*
  Empty space around text blocks.
*/

const WORD_GAP =
  60;


/*
  Number of attempts used when
  finding a safe location.
*/

const PLACEMENT_ATTEMPTS =
  400;



/* =========================================================
   ALL CONFESSIONS
   ========================================================= */

const confessions =
  new Map();


/*
  These are the ONLY confession
  objects currently on screen.
*/

const activeItems =
  [];


/*
  Queue containing every
  submission that needs to appear.
*/

let cycleQueue =
  [];


let queueIndex =
  0;


let projectionInitialized =
  false;



/* =========================================================
   RANDOM
   ========================================================= */

function random(
  min,
  max
){

  return (
    Math.random() *
    (max - min)
  ) + min;

}



/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(
  array
){

  const copy =
    [...array];


  for(
    let i=copy.length - 1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}



/* =========================================================
   FONT SIZE
   ========================================================= */

function getFontSize(
  text
){

  const length =
    text.length;


  /*
    Long submissions remain
    readable.
  */

  if(
    length > 400
  ){

    return random(
      21,
      24
    );

  }


  if(
    length > 300
  ){

    return random(
      23,
      27
    );

  }


  if(
    length > 200
  ){

    return random(
      25,
      30
    );

  }


  if(
    length > 120
  ){

    return random(
      28,
      33
    );

  }


  return random(
    31,
    40
  );

}



/* =========================================================
   RECTANGLE
   ========================================================= */

function makeRect(
  x,
  y,
  width,
  height
){

  return {

    left:x,

    top:y,

    right:
      x + width,

    bottom:
      y + height

  };

}



/* =========================================================
   RECTANGLE OVERLAP
   ========================================================= */

function overlaps(
  a,
  b,
  gap=0
){

  return !(
    a.right + gap <= b.left ||
    a.left >= b.right + gap ||
    a.bottom + gap <= b.top ||
    a.top >= b.bottom + gap
  );

}



/* =========================================================
   IS POSITION OPEN
   ========================================================= */

function isPositionOpen(
  x,
  y,
  width,
  height,
  ignoreItem=null
){

  const candidate =
    makeRect(
      x,
      y,
      width,
      height
    );


  for(
    const item of activeItems
  ){

    if(
      item === ignoreItem
    ){

      continue;

    }


    const other =
      makeRect(
        item.x,
        item.y,
        item.el.offsetWidth,
        item.el.offsetHeight
      );


    if(
      overlaps(
        candidate,
        other,
        WORD_GAP
      )
    ){

      return false;

    }

  }


  return true;

}



/* =========================================================
   FIND INITIAL POSITION
   ========================================================= */

function findInitialPosition(
  width,
  height
){

  const viewportWidth =
    space.clientWidth;


  const viewportHeight =
    space.clientHeight;


  /*
    Keep the very top clear
    for the buttons.
  */

  const topMargin =
    window.innerWidth <= 600
      ? 90
      : 110;


  const bottomMargin =
    40;


  /*
    RANDOM SEARCH
    */

  for(
    let attempt=0;
    attempt<PLACEMENT_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        10,
        Math.max(
          11,
          viewportWidth -
          width -
          10
        )
      );


    const y =
      random(
        topMargin,
        Math.max(
          topMargin + 1,
          viewportHeight -
          height -
          bottomMargin
        )
      );


    if(
      isPositionOpen(
        x,
        y,
        width,
        height
      )
    ){

      return {
        x,
        y
      };

    }

  }


  /*
    GRID FALLBACK

    Instead of randomly putting
    the word somewhere and allowing
    overlap, systematically search
    the entire screen.
  */

  const step =
    20;


  for(
    let y=topMargin;
    y<=viewportHeight-height-bottomMargin;
    y+=step
  ){

    for(
      let x=10;
      x<=viewportWidth-width-10;
      x+=step
    ){

      if(
        isPositionOpen(
          x,
          y,
          width,
          height
        )
      ){

        return {
          x,
          y
        };

      }

    }

  }


  /*
    If there genuinely isn't room,
    return null.

    The caller will simply show
    fewer active confessions rather
    than stacking them.
  */

  return null;

}



/* =========================================================
   FIND SAFE SPAWN POSITION
   ========================================================= */

function findSpawnPosition(
  width,
  height,
  ignoreItem=null
){

  const viewportWidth =
    space.clientWidth;


  /*
    Base position immediately
    above the top edge.
  */

  const baseY =
    -height - 20;


  /*
    First try to find a horizontal
    area with NO active confession
    intersecting its falling path.

    This is what prevents a word
    from entering directly on top
    of another word.
  */

  for(
    let attempt=0;
    attempt<PLACEMENT_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        10,
        Math.max(
          11,
          viewportWidth -
          width -
          10
        )
      );


    let horizontalConflict =
      false;


    for(
      const item of activeItems
    ){

      if(
        item === ignoreItem
      ){

        continue;

      }


      const wordLeft =
        x;


      const wordRight =
        x + width;


      const otherLeft =
        item.x -
        WORD_GAP;


      const otherRight =
        item.x +
        item.el.offsetWidth +
        WORD_GAP;


      const conflict =
        wordRight >
        otherLeft
        &&
        wordLeft <
        otherRight;


      if(
        conflict
      ){

        horizontalConflict =
          true;

        break;

      }

    }


    /*
      No horizontal conflict means
      it can enter immediately above
      the screen.
    */

    if(
      !horizontalConflict
    ){

      return {

        x,

        y:baseY

      };

    }

  }


  /*
    If every horizontal area has
    another confession in it, put
    the new one ABOVE the earliest
    word on that path.

    Because every word moves at
    exactly the same speed, that
    spacing remains constant.
  */

  let bestX =
    random(
      10,
      Math.max(
        11,
        viewportWidth -
        width -
        10
      )
    );


  let bestY =
    baseY;


  let bestScore =
    Infinity;


  for(
    let attempt=0;
    attempt<PLACEMENT_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        10,
        Math.max(
          11,
          viewportWidth -
          width -
          10
        )
      );


    let requiredY =
      baseY;


    let conflictCount =
      0;


    for(
      const item of activeItems
    ){

      if(
        item === ignoreItem
      ){

        continue;

      }


      const wordLeft =
        x;


      const wordRight =
        x + width;


      const otherLeft =
        item.x -
        WORD_GAP;


      const otherRight =
        item.x +
        item.el.offsetWidth +
        WORD_GAP;


      const horizontalConflict =
        wordRight >
        otherLeft
        &&
        wordLeft <
        otherRight;


      if(
        horizontalConflict
      ){

        conflictCount++;


        requiredY =
          Math.min(
            requiredY,
            item.y -
            height -
            WORD_GAP
          );

      }

    }


    const score =
      conflictCount *
      1000 +
      Math.abs(
        requiredY -
        baseY
      );


    if(
      score <
      bestScore
    ){

      bestScore =
        score;


      bestX =
        x;


      bestY =
        requiredY;

    }

  }


  return {

    x:
      bestX,

    y:
      bestY

  };

}



/* =========================================================
   GET NEXT CONFESSION
   ========================================================= */

function getNextConfessionId(){

  if(
    confessions.size === 0
  ){

    return null;

  }


  const activeIds =
    new Set(
      activeItems.map(
        item =>
          item.id
      )
    );


  /*
    Continue through current cycle.
  */

  while(
    queueIndex <
    cycleQueue.length
  ){

    const id =
      cycleQueue[
        queueIndex
      ];


    queueIndex++;


    if(
      confessions.has(id) &&
      !activeIds.has(id)
    ){

      return id;

    }

  }


  /*
    Current cycle is exhausted.

    Start a fresh randomized cycle.
  */

  const available =
    Array.from(
      confessions.keys()
    ).filter(
      id =>
        !activeIds.has(id)
    );


  if(
    available.length === 0
  ){

    /*
      Only happens when there are
      fewer total submissions than
      visible slots.
    */

    const all =
      Array.from(
        confessions.keys()
      );


    if(
      all.length
    ){

      return all[
        Math.floor(
          Math.random() *
          all.length
        )
      ];

    }


    return null;

  }


  cycleQueue =
    shuffle(
      available
    );


  queueIndex =
    0;


  return (
    cycleQueue[
      queueIndex++
    ] || null
  );

}



/* =========================================================
   CREATE ACTIVE WORD
   ========================================================= */

function createActiveWord(
  id,
  initial=false
){

  const data =
    confessions.get(
      id
    );


  if(
    !data
  ){

    return null;

  }


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "word";


  el.textContent =
    data.text;


  el.dataset.id =
    id;


  el.style.fontSize =
    getFontSize(
      data.text
    ) + "px";


  space.appendChild(
    el
  );


  /*
    Force measurement.
  */

  const width =
    el.offsetWidth;


  const height =
    el.offsetHeight;


  let position;


  if(
    initial
  ){

    position =
      findInitialPosition(
        width,
        height
      );

  }else{

    position =
      findSpawnPosition(
        width,
        height
      );

  }


  /*
    There is genuinely not enough
    room right now.

    Do NOT stack the word.
  */

  if(
    !position
  ){

    el.remove();

    return null;

  }


  const item = {

    id,

    el,

    x:
      position.x,

    y:
      position.y,

    speed:
      FALL_SPEED,

    pulseOffset:
      random(
        0,
        Math.PI * 2
      ),

    pulseSpeed:
      random(
        0.0005,
        0.0010
      ),

    opacityBase:
      initial
        ? random(
            0.48,
            0.68
          )
        : 0.82

  };


  activeItems.push(
    item
  );


  /*
    Moderation.
  */

  el.addEventListener(
    "click",
    () => {

      if(
        !adminUnlocked
      ){

        return;

      }


      selectConfession(
        item.id
      );

    }
  );


  applyModerationState();


  return item;

}



/* =========================================================
   RECYCLE ACTIVE WORD
   ========================================================= */

function recycleItem(
  item
){

  const oldId =
    item.id;


  /*
    Find the next submission.
  */

  let nextId =
    getNextConfessionId();


  /*
    Avoid immediately showing
    exactly the same confession
    when alternatives exist.
  */

  if(
    nextId === oldId &&
    confessions.size > 1
  ){

    const alternatives =
      Array.from(
        confessions.keys()
      ).filter(
        id =>
          id !== oldId &&
          !activeItems.some(
            active =>
              active !== item &&
              active.id === id
          )
      );


    if(
      alternatives.length
    ){

      nextId =
        alternatives[
          Math.floor(
            Math.random() *
            alternatives.length
          )
        ];

    }

  }


  if(
    !nextId
  ){

    return;

  }


  const nextData =
    confessions.get(
      nextId
    );


  if(
    !nextData
  ){

    return;

  }


  /*
    Remove old ID from moderation map.
  */

  wordItems.delete(
    oldId
  );


  /*
    Change the active element
    into the next confession.
  */

  item.id =
    nextId;


  item.el.dataset.id =
    nextId;


  item.el.textContent =
    nextData.text;


  item.el.style.fontSize =
    getFontSize(
      nextData.text
    ) + "px";


  /*
    Force layout again because
    the text dimensions changed.
  */

  const width =
    item.el.offsetWidth;


  const height =
    item.el.offsetHeight;


  /*
    Find a safe position above
    the screen.
  */

  const position =
    findSpawnPosition(
      width,
      height,
      item
    );


  item.x =
    position.x;


  item.y =
    position.y;


  /*
    Reset pulse.
  */

  item.pulseOffset =
    random(
      0,
      Math.PI * 2
    );


  item.pulseSpeed =
    random(
      0.0005,
      0.0010
    );


  item.opacityBase =
    0.82;


  item.el.style.opacity =
    0;


  wordItems.set(
    nextId,
    item
  );


  /*
    Update moderation.
  */

  buildAdminList();

}



/* =========================================================
   WORD MAP
   ========================================================= */

const wordItems =
  new Map();



/* =========================================================
   APPLY MODERATION STATE
   ========================================================= */

function applyModerationState(){

  activeItems.forEach(
    item => {

      item.el.classList.toggle(
        "moderatable",
        adminUnlocked
      );

    }
  );

}



/* =========================================================
   SHOW SPACE
   ========================================================= */

function showSpace(){

  entry.classList.add(
    "hidden"
  );


  space.classList.add(
    "visible"
  );


  /*
    Start the video from the
    visitor interaction.
  */

  startVideo();

}



/* =========================================================
   SHOW ENTRY
   ========================================================= */

function showEntry(){

  space.classList.remove(
    "visible"
  );


  entry.classList.remove(
    "hidden"
  );


  input.focus();

}



/* =========================================================
   ENTER SHARED SPACE
   ========================================================= */

enterSpace.addEventListener(
  "click",
  () => {

    showSpace();

  }
);



/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    /*
      Start video immediately
      from the user interaction.
    */

    startVideo();


    const text =
      input.value
        .trim()
        .replace(
          /\s+/g,
          " "
        );


    if(
      !text
    ){

      return;

    }


    release.disabled =
      true;


    status.textContent =
      "Releasing…";


    try{

      await push(
        confessionRef,
        {

          text,

          createdAt:
            Date.now()

        }
      );


      input.value =
        "";


      status.textContent =
        "";


      showSpace();


    }catch(error){

      console.error(
        "Submission error:",
        error
      );


      status.textContent =
        "Something went wrong. Try again.";


      release.disabled =
        false;

    }

  }
);



/* =========================================================
   BACK
   ========================================================= */

back.addEventListener(
  "click",
  () => {

    showEntry();


    release.disabled =
      false;


    status.textContent =
      "";

  }
);



/* =========================================================
   FIREBASE DATA
   ========================================================= */

onValue(
  confessionRef,
  snapshot => {

    const incoming =
      new Map();


    snapshot.forEach(
      child => {

        const data =
          child.val();


        if(
          data &&
          typeof data.text ===
          "string"
        ){

          incoming.set(
            child.key,
            {

              text:
                data.text,

              createdAt:
                data.createdAt ||
                0

            }
          );

        }

      }
    );



    /* -------------------------------------------------------
       INITIAL LOAD
       ------------------------------------------------------- */

    if(
      !projectionInitialized
    ){

      incoming.forEach(
        (data,id) => {

          confessions.set(
            id,
            data
          );

        }
      );


      cycleQueue =
        shuffle(
          Array.from(
            confessions.keys()
          )
        );


      queueIndex =
        0;


      projectionInitialized =
        true;


      const desired =
        Math.min(
          getVisibleCount(),
          confessions.size
        );


      /*
        Fill only what will actually
        fit on the current screen.
      */

      for(
        let i=0;
        i<desired;
        i++
      ){

        const id =
          getNextConfessionId();


        if(
          !id
        ){

          break;

        }


        const item =
          createActiveWord(
            id,
            true
          );


        if(
          !item
        ){

          /*
            If there genuinely isn't
            room for another confession,
            stop rather than overlapping.
          */

          break;

        }


        wordItems.set(
          id,
          item
        );

      }


      empty.style.display =
        confessions.size
          ? "none"
          : "flex";


      buildAdminList();


      return;

    }



    /* -------------------------------------------------------
       NEW / UPDATED CONFESSIONS
       ------------------------------------------------------- */

    incoming.forEach(
      (data,id) => {

        if(
          !confessions.has(id)
        ){

          confessions.set(
            id,
            data
          );


          /*
            Add new submission to
            the cycle queue.

            It will appear naturally
            as the queue moves through
            submissions.
          */

          if(
            !cycleQueue.includes(id)
          ){

            cycleQueue.push(
              id
            );

          }

        }else{

          confessions.set(
            id,
            data
          );

        }

      }
    );



    /* -------------------------------------------------------
       DELETED CONFESSIONS
       ------------------------------------------------------- */

    const deletedIds =
      Array.from(
        confessions.keys()
      ).filter(
        id =>
          !incoming.has(id)
      );


    deletedIds.forEach(
      id => {

        confessions.delete(
          id
        );


        cycleQueue =
          cycleQueue.filter(
            queueId =>
              queueId !== id
          );


        const active =
          activeItems.find(
            item =>
              item.id === id
          );


        if(
          active
        ){

          const index =
            activeItems.indexOf(
              active
            );


          if(
            index !== -1
          ){

            activeItems.splice(
              index,
              1
            );

          }


          wordItems.delete(
            id
          );


          active.el.remove();


          /*
            Immediately replace the
            deleted visible confession
            with another one.
          */

          const replacementId =
            getNextConfessionId();


          if(
            replacementId
          ){

            const replacement =
              createActiveWord(
                replacementId,
                false
              );


            if(
              replacement
            ){

              wordItems.set(
                replacementId,
                replacement
              );

            }

          }

        }

      }
    );



    /* -------------------------------------------------------
       MAINTAIN ACTIVE COUNT
       ------------------------------------------------------- */

    const desired =
      Math.min(
        getVisibleCount(),
        confessions.size
      );


    while(
      activeItems.length <
      desired
    ){

      const id =
        getNextConfessionId();


      if(
        !id
      ){

        break;

      }


      const item =
        createActiveWord(
          id,
          false
        );


      if(
        !item
      ){

        /*
          Do not force another word
          into an occupied area.
        */

        break;

      }


      wordItems.set(
        id,
        item
      );

    }



    /* -------------------------------------------------------
       EMPTY STATE
       ------------------------------------------------------- */

    empty.style.display =
      confessions.size
        ? "none"
        : "flex";


    buildAdminList();

  }
);



/* =========================================================
   SELECT CONFESSION
   ========================================================= */

function selectConfession(
  id
){

  selectedId =
    id;


  activeItems.forEach(
    item => {

      item.el.classList.remove(
        "selected"
      );

    }
  );


  const visibleItem =
    activeItems.find(
      item =>
        item.id === id
    );


  if(
    visibleItem
  ){

    visibleItem.el.classList.add(
      "selected"
    );

  }


  document
    .querySelectorAll(
      ".modItem"
    )
    .forEach(
      row => {

        row.classList.toggle(
          "selected",
          row.dataset.id === id
        );

      }
    );


  deleteButton.style.display =
    "block";

}



/* =========================================================
   ADMIN LIST
   ========================================================= */

function buildAdminList(){

  adminList.innerHTML =
    "";


  confessions.forEach(
    (data,id) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "modItem";


      row.dataset.id =
        id;


      row.textContent =
        data.text;


      if(
        id === selectedId
      ){

        row.classList.add(
          "selected"
        );

      }


      row.addEventListener(
        "click",
        () => {

          selectConfession(
            id
          );

        }
      );


      adminList.appendChild(
        row
      );

    }
  );

}



/* =========================================================
   MODERATION PANEL
   ========================================================= */

moderate.addEventListener(
  "click",
  () => {

    moderationPanel.classList.toggle(
      "open"
    );


    if(
      moderationPanel.classList.contains(
        "open"
      )
    ){

      adminPin.focus();


      if(
        adminUnlocked
      ){

        buildAdminList();

      }

    }

  }
);



/* =========================================================
   LOGIN
   ========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    if(
      adminPin.value ===
      ADMIN_PIN
    ){

      adminUnlocked =
        true;


      adminPin.value =
        "";


      adminList.style.display =
        "block";


      moderationStatus.textContent =
        "Moderation unlocked. Select a confession to delete it.";


      buildAdminList();


      applyModerationState();


    }else{

      adminUnlocked =
        false;


      moderationStatus.textContent =
        "Incorrect PIN.";

    }

  }
);



/* =========================================================
   DELETE
   ========================================================= */

deleteButton.addEventListener(
  "click",
  async () => {

    if(
      !adminUnlocked
    ){

      moderationStatus.textContent =
        "Moderation is locked.";

      return;

    }


    if(
      !selectedId
    ){

      moderationStatus.textContent =
        "Select a confession first.";

      return;

    }


    if(
      !confessions.has(
        selectedId
      )
    ){

      moderationStatus.textContent =
        "That confession could not be found.";

      return;

    }


    if(
      !window.confirm(
        "Delete this confession from the shared space?"
      )
    ){

      return;

    }


    try{

      await remove(
        ref(
          database,
          "confessions/" +
          selectedId
        )
      );


      selectedId =
        null;


      deleteButton.style.display =
        "none";


      moderationStatus.textContent =
        "Confession deleted.";


    }catch(error){

      console.error(
        "Delete error:",
        error
      );


      moderationStatus.textContent =
        "Delete failed. Check Firebase Rules.";

    }

  }
);



/* =========================================================
   ANIMATION
   ========================================================= */

let lastTime =
  performance.now();


function animate(
  currentTime
){

  const delta =
    currentTime -
    lastTime;


  lastTime =
    currentTime;


  const height =
    space.clientHeight;


  activeItems.forEach(
    item => {


      /*
        ---------------------------------
        SLOW FALL
        ---------------------------------
      */

      item.y +=
        item.speed *
        delta;



      /*
        ---------------------------------
        SOFT PULSE
        ---------------------------------
      */

      const pulse =
        Math.sin(
          currentTime *
          item.pulseSpeed +
          item.pulseOffset
        );


      let opacity =
        item.opacityBase +
        pulse * 0.10;



      /*
        ---------------------------------
        FADE IN
        ---------------------------------
      */

      if(
        item.y < 180
      ){

        const fadeIn =
          Math.max(
            0,
            Math.min(
              1,
              (
                item.y +
                120
              ) /
              300
            )
          );


        opacity *=
          fadeIn;

      }



      /*
        ---------------------------------
        FADE OUT
        ---------------------------------
      */

      if(
        item.y >
        height * .80
      ){

        const fadeOut =
          1 -
          (
            (
              item.y -
              height * .80
            ) /
            (
              height * .20
            )
          );


        opacity *=
          Math.max(
            0,
            Math.min(
              1,
              fadeOut
            )
          );

      }



      /*
        ---------------------------------
        OPACITY
        ---------------------------------
      */

      item.el.style.opacity =
        Math.max(
          0,
          Math.min(
            .90,
            opacity
          )
        );



      /*
        ---------------------------------
        POSITION
        ---------------------------------
      */

      item.el.style.transform =
        "translate(" +
        item.x +
        "px," +
        item.y +
        "px)";



      /*
        ---------------------------------
        RECYCLE
        ---------------------------------

        Once this confession has
        completely left the screen,
        immediately replace it with
        the next confession.
      */

      if(
        item.y >
        height + 30
      ){

        recycleItem(
          item
        );

      }

    }
  );


  requestAnimationFrame(
    animate
  );

}



/* =========================================================
   START
   ========================================================= */

requestAnimationFrame(
  animate
);


</script>
