<script type="module">


/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBnzqy7qtsuGJEcKkXlW2CIy76ZwZu3uQ4",

    "confession-installation.firebaseapp.com",

    "https://confession-installation-default-rtdb.firebaseio.com",

  messagingSenderId:
    "715428481943",

  appId:
    "1:715428481943:web:49e9e0d3d3aaad7ef2d2d2",

  measurementId:
    "G-325RR1JKNW"

};



import {
  initializeApp
}
from
  "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";



import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  onChildRemoved,
  remove
}
from
  "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";



const app =
  initializeApp(
    firebaseConfig
  );


const database =
  getDatabase(app);


const confessionRef =
  ref(
    database,
    "confessions"
  );



/* =========================================================
   ELEMENTS
   ========================================================= */

const entry =
  document.getElementById(
    "entry"
  );


const space =
  document.getElementById(
    "space"
  );


const form =
  document.getElementById(
    "form"
  );


const input =
  document.getElementById(
    "input"
  );


const release =
  document.getElementById(
    "release"
  );


const status =
  document.getElementById(
    "status"
  );


const enterSpace =
  document.getElementById(
    "enterSpace"
  );


const back =
  document.getElementById(
    "back"
  );


const empty =
  document.getElementById(
    "empty"
  );


const moderate =
  document.getElementById(
    "moderate"
  );


const moderationPanel =
  document.getElementById(
    "moderationPanel"
  );


const adminPin =
  document.getElementById(
    "adminPin"
  );


const loginButton =
  document.getElementById(
    "loginButton"
  );


const moderationStatus =
  document.getElementById(
    "moderationStatus"
  );


const adminList =
  document.getElementById(
    "adminList"
  );

  document.getElementById(
    "deleteButton"
  );


const backgroundVideo =
  document.getElementById(
    "backgroundVideo"
  );



/* =========================================================
   VIDEO WITH SOUND
   ========================================================= */

/*
  We intentionally do NOT start the video
  automatically when the page first loads.

  Browsers often block audible autoplay.

  Instead, the video starts when the
  visitor actively enters the shared space.
*/

function startVideo(){

  backgroundVideo.muted =
    false;


  backgroundVideo.volume =
    1;


  const playPromise =
    backgroundVideo.play();


  if(
    playPromise &&
    typeof playPromise.catch ===
    "function"
  ){

    playPromise.catch(
      error => {

        console.log(
          "Video playback was blocked:",
          error
        );

      }
    );

  }

}



/* =========================================================
   MODERATION
   ========================================================= */

const ADMIN_PIN =
  "0092";


let adminUnlocked =
  false;


let selectedId =
  null;



/* =========================================================
   FALLING SYSTEM
   ========================================================= */

const MAX_WORDS =
  150;


/*
  One shared speed.

  Keeping every confession at
  exactly the same speed prevents
  them from catching one another.
*/

const FALL_SPEED =
  0.018;


/*
  Space between confession blocks.
*/

const WORD_GAP =
  70;


/*
  Number of random attempts used
  when finding an open location.
*/

const PLACEMENT_ATTEMPTS =
  250;



/* =========================================================
   STORAGE
   ========================================================= */

const words =
  [];


const wordItems =
  new Map();



/* =========================================================
   RANDOM
   ========================================================= */

function random(
  min,
  max
){

  return (
    Math.random() *
    (max - min)
  ) + min;

}



/* =========================================================
   FONT SIZE
   ========================================================= */

function getFontSize(
  text
){

  const length =
    text.length;


  /*
    Long confessions stay readable.
  */

  if(
    length > 400
  ){

    return random(
      21,
      24
    );

  }


  if(
    length > 300
  ){

    return random(
      23,
      27
    );

  }


  if(
    length > 200
  ){

    return random(
      25,
      30
    );

  }


  if(
    length > 120
  ){

    return random(
      28,
      33
    );

  }


  return random(
    31,
    40
  );

}



/* =========================================================
   RECTANGLE
   ========================================================= */

function getRect(
  x,
  y,
  width,
  height
){

  return {

    left:x,

    top:y,

    right:
      x + width,

    bottom:
      y + height

  };

}



/* =========================================================
   COLLISION TEST
   ========================================================= */

function rectanglesOverlap(
  a,
  b,
  gap
){

  return !(
    a.right + gap <= b.left ||
    a.left >= b.right + gap ||
    a.bottom + gap <= b.top ||
    a.top >= b.bottom + gap
  );

}



/* =========================================================
   OPEN POSITION TEST
   ========================================================= */

function positionIsOpen(
  x,
  y,
  width,
  height,
  ignoreItem=null
){

  const candidate =
    getRect(
      x,
      y,
      width,
      height
    );


  for(
    const item of words
  ){

    if(
      item === ignoreItem
    ){

      continue;

    }


    const itemRect =
      getRect(
        item.x,
        item.y,
        item.el.offsetWidth,
        item.el.offsetHeight
      );


    if(
      rectanglesOverlap(
        candidate,
        itemRect,
        WORD_GAP
      )
    ){

      return false;

    }

  }


  return true;

}



/* =========================================================
   FIND OPEN POSITION
   ========================================================= */

function findOpenPosition(
  width,
  height,
  initial=false,
  ignoreItem=null
){

  const spaceWidth =
    space.clientWidth;


  const spaceHeight =
    space.clientHeight;



  /* ---------------------------------------------------------
     INITIAL PLACEMENT
     --------------------------------------------------------- */

  if(
    initial
  ){

    for(
      let attempt=0;
      attempt<PLACEMENT_ATTEMPTS;
      attempt++
    ){

      const x =
        random(
          0,
          Math.max(
            1,
            spaceWidth -
            width
          )
        );


      const y =
        random(
          20,
          Math.max(
            21,
            spaceHeight -
            height -
            20
          )
        );


      if(
        positionIsOpen(
          x,
          y,
          width,
          height,
          ignoreItem
        )
      ){

        return {
          x,
          y
        };

      }

    }


    /*
      Fallback.
    */

    return {

      x:
        random(
          0,
          Math.max(
            1,
            spaceWidth -
            width
          )
        ),

      y:
        random(
          20,
          Math.max(
            21,
            spaceHeight -
            height
          )
        )

    };

  }



  /* ---------------------------------------------------------
     NEW / RECYCLED WORD
     --------------------------------------------------------- */

  const topY =
    -height -
    random(
      10,
      50
    );


  for(
    let attempt=0;
    attempt<PLACEMENT_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        0,
        Math.max(
          1,
          spaceWidth -
          width
        )
      );


    const candidate =
      getRect(
        x,
        topY,
        width,
        height
      );


    let blocked =
      false;


    /*
      Check the vertical path around
      the top entry point.
    */

    for(
      const item of words
    ){

      if(
        item === ignoreItem
      ){

        continue;

      }


      const itemRect =
        getRect(
          item.x,
          item.y,
          item.el.offsetWidth,
          item.el.offsetHeight
        );


      /*
        Ignore words far below the
        incoming confession.
      */

      if(
        itemRect.top >
        candidate.bottom +
        WORD_GAP +
        100
      ){

        continue;

      }


      /*
        Ignore words far above it.
      */

      if(
        itemRect.bottom <
        candidate.top -
        WORD_GAP -
        100
      ){

        continue;

      }


      if(
        rectanglesOverlap(
          candidate,
          itemRect,
          WORD_GAP
        )
      ){

        blocked =
          true;

        break;

      }

    }


    if(
      !blocked
    ){

      return {

        x,
        y:topY

      };

    }

  }


  /*
    Fallback if the projection is
    extremely crowded.
  */

  return {

    x:
      random(
        0,
        Math.max(
          1,
          spaceWidth -
          width
        )
      ),

    y:
      topY

  };

}



/* =========================================================
   ADD WORD
   ========================================================= */

function addWord(
  id,
  text,
  initial=false
){

  if(
    !text
  ){

    return;

  }


  empty.style.display =
    "none";


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "word";


  el.textContent =
    text;


  el.dataset.id =
    id;


  /*
    Set readable size.
  */

  el.style.fontSize =
    getFontSize(text) +
    "px";


  space.appendChild(
    el
  );


  /*
    Measure after the element
    is in the DOM.
  */

  const wordWidth =
    el.offsetWidth;


  const wordHeight =
    el.offsetHeight;


  /*
    Find a non-overlapping position.
  */

  const position =
    findOpenPosition(
      wordWidth,
      wordHeight,
      initial
    );


  const item = {

    id,

    el,

    x:
      position.x,

    y:
      position.y,

    /*
      Every word has exactly the
      same falling speed.
    */

    speed:
      FALL_SPEED,


    /*
      Individual pulse timing.
    */

    pulseOffset:
      random(
        0,
        Math.PI * 2
      ),

    pulseSpeed:
      random(
        0.0005,
        0.0010
      ),

    opacityBase:
      random(
        0.48,
        0.72
      )

  };


  words.push(
    item
  );


  wordItems.set(
    id,
    item
  );


  /*
    New submissions are slightly
    brighter.
  */

  if(
    !initial
  ){

    item.opacityBase =
      0.82;

  }


  /*
    Moderation selection.
  */

  el.addEventListener(
    "click",
    () => {

      if(
        !adminUnlocked
      ){

        return;

      }


      selectConfession(
        id
      );

    }
  );


  /*
    Keep maximum at 150.
  */

  while(
    words.length >
    MAX_WORDS
  ){

    const old =
      words.shift();


    wordItems.delete(
      old.id
    );


    old.el.remove();

  }


  return item;

}



/* =========================================================
   SHOW SPACE
   ========================================================= */

function showSpace(){

  entry.classList.add(
    "hidden"
  );


  space.classList.add(
    "visible"
  );


  /*
    User has just interacted,
    so start the video with sound.
  */

  startVideo();

}



/* =========================================================
   SHOW ENTRY
   ========================================================= */

function showEntry(){

  space.classList.remove(
    "visible"
  );


  entry.classList.remove(
    "hidden"
  );


  input.focus();

}



/* =========================================================
   ENTER SHARED SPACE
   ========================================================= */

enterSpace.addEventListener(
  "click",
  () => {

    showSpace();

  }
);



/* =========================================================
   SUBMIT CONFESSION
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    /*
      Start the video immediately
      from the user's click before
      doing any asynchronous Firebase
      work.

      This gives the browser the best
      chance of allowing sound.
    */

    startVideo();


    const text =
      input.value
        .trim()
        .replace(
          /\s+/g,
          " "
        );


    if(
      !text
    ){

      return;

    }


    release.disabled =
      true;


    status.textContent =
      "Releasing…";


    try{

      await push(
        confessionRef,
        {

          text,

          createdAt:
            Date.now()

        }
      );


      input.value =
        "";


      status.textContent =
        "";


      showSpace();


    }catch(error){

      console.error(
        "Submission error:",
        error
      );


      status.textContent =
        "Something went wrong. Try again.";


      release.disabled =
        false;

    }

  }
);



/* =========================================================
   BACK
   ========================================================= */

back.addEventListener(
  "click",
  () => {

    showEntry();


    release.disabled =
      false;


    status.textContent =
      "";

  }
);



/* =========================================================
   FIREBASE: NEW CONFESSION
   ========================================================= */

onChildAdded(
  confessionRef,
  snapshot => {

    const data =
      snapshot.val();


    if(
      !data ||
      typeof data.text !==
      "string"
    ){

      return;

    }


    /*
      Existing confessions are
      distributed through the screen.

      New ones enter from above.
    */

    const initial =
      !space.classList.contains(
        "visible"
      );


    addWord(
      snapshot.key,
      data.text,
      initial
    );

  }
);



/* =========================================================
   FIREBASE: REMOVE
   ========================================================= */

onChildRemoved(
  confessionRef,
  snapshot => {

    const id =
      snapshot.key;


    const item =
      wordItems.get(
        id
      );


    if(
      !item
    ){

      return;

    }


    item.el.remove();


    wordItems.delete(
      id
    );


    const index =
      words.indexOf(
        item
      );


    if(
      index !== -1
    ){

      words.splice(
        index,
        1
      );

    }


    if(
      selectedId === id
    ){

      selectedId =
        null;


      deleteButton.style.display =
        "none";

    }


    buildAdminList();

  }
);



/* =========================================================
   SELECT CONFESSION
   ========================================================= */

function selectConfession(
  id
){

  selectedId =
    id;


  wordItems.forEach(
    item => {

      item.el.classList.remove(
        "selected"
      );

    }
  );


  const item =
    wordItems.get(
      id
    );


  if(
    item
  ){

    item.el.classList.add(
      "selected"
    );

  }


  document
    .querySelectorAll(
      ".modItem"
    )
    .forEach(
      row => {

        row.classList.toggle(
          "selected",
          row.dataset.id ===
          id
        );

      }
    );


  deleteButton.style.display =
    "block";

}



/* =========================================================
   ADMIN LIST
   ========================================================= */

function buildAdminList(){

  adminList.innerHTML =
    "";


  wordItems.forEach(
    (item,id) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "modItem";


      row.dataset.id =
        id;


      row.textContent =
        item.el.textContent;


      row.addEventListener(
        "click",
        () => {

          selectConfession(
            id
          );

        }
      );


      adminList.appendChild(
        row
      );

    }
  );

}



/* =========================================================
   MODERATION PANEL
   ========================================================= */

moderate.addEventListener(
  "click",
  () => {

    moderationPanel.classList.toggle(
      "open"
    );


    if(
      moderationPanel.classList.contains(
        "open"
      )
    ){

      adminPin.focus();


      if(
        adminUnlocked
      ){

        buildAdminList();

      }

    }

  }
);



/* =========================================================
   LOGIN
   ========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    if(
      adminPin.value ===
      ADMIN_PIN
    ){

      adminUnlocked =
        true;


      adminPin.value =
        "";


      adminList.style.display =
        "block";


      moderationStatus.textContent =
        "Moderation unlocked. Select a confession to delete it.";


      buildAdminList();


      wordItems.forEach(
        item => {

          item.el.classList.add(
            "moderatable"
          );

        }
      );


    }else{

      adminUnlocked =
        false;


      moderationStatus.textContent =
        "Incorrect PIN.";

    }

  }
);



/* =========================================================
   DELETE
   ========================================================= */

deleteButton.addEventListener(
  "click",
  async () => {

    if(
      !adminUnlocked
    ){

      moderationStatus.textContent =
        "Moderation is locked.";

      return;

    }


    if(
      !selectedId
    ){

      moderationStatus.textContent =
        "Select a confession first.";

      return;

    }


    const idToDelete =
      selectedId;


    const item =
      wordItems.get(
        idToDelete
      );


    if(
      !item
    ){

      moderationStatus.textContent =
        "That confession could not be found.";

      return;

    }


    if(
      !window.confirm(
        "Delete this confession from the shared space?"
      )
    ){

      return;

    }


    try{

      await remove(
        ref(
          database,
          "confessions/" +
          idToDelete
        )
      );


      selectedId =
        null;


      deleteButton.style.display =
        "none";


      moderationStatus.textContent =
        "Confession deleted.";


    }catch(error){

      console.error(
        "Delete error:",
        error
      );


      moderationStatus.textContent =
        "Delete failed. Check Firebase Rules.";

    }

  }
);



/* =========================================================
   CONTINUOUS FALLING ANIMATION
   ========================================================= */

let lastTime =
  performance.now();


function animate(
  currentTime
){

  const delta =
    currentTime -
    lastTime;


  lastTime =
    currentTime;


  const width =
    space.clientWidth;


  const height =
    space.clientHeight;


  words.forEach(
    item => {


      /*
        ---------------------------------
        FALL
        ---------------------------------
      */

      item.y +=
        item.speed *
        delta;



      /*
        ---------------------------------
        PULSE
        ---------------------------------
      */

      const pulse =
        Math.sin(
          currentTime *
          item.pulseSpeed +
          item.pulseOffset
        );


      let opacity =
        item.opacityBase +
        pulse * 0.10;



      /*
        ---------------------------------
        FADE IN AT TOP
        ---------------------------------
      */

      if(
        item.y < 180
      ){

        const fadeIn =
          Math.max(
            0,
            Math.min(
              1,
              (
                item.y + 120
              ) /
              300
            )
          );


        opacity *=
          fadeIn;

      }



      /*
        ---------------------------------
        FADE OUT AT BOTTOM
        ---------------------------------
      */

      if(
        item.y >
        height * 0.80
      ){

        const fadeOut =
          1 -
          (
            (
              item.y -
              height * 0.80
            ) /
            (
              height * 0.20
            )
          );


        opacity *=
          Math.max(
            0,
            Math.min(
              1,
              fadeOut
            )
          );

      }



      /*
        ---------------------------------
        OPACITY
        ---------------------------------
      */

      opacity =
        Math.max(
          0,
          Math.min(
            0.90,
            opacity
          )
        );



      /*
        ---------------------------------
        POSITION
        ---------------------------------
      */

      item.el.style.transform =
        "translate(" +
        item.x +
        "px," +
        item.y +
        "px)";


      item.el.style.opacity =
        opacity;



      /*
        =================================================
        RECYCLE
        =================================================

        The confession never gets deleted.

        As soon as it leaves the bottom,
        it gets moved above the top.

        It then starts another fall.
        =================================================
      */

      if(
        item.y >
        height + 20
      ){

        const wordWidth =
          item.el.offsetWidth;


        const wordHeight =
          item.el.offsetHeight;


        /*
          Find a fresh open position
          above the projection.
        */

        const position =
          findOpenPosition(
            wordWidth,
            wordHeight,
            false,
            item
          );


        item.x =
          position.x;


        item.y =
          position.y;


        /*
          New pulse rhythm.
        */

        item.pulseOffset =
          random(
            0,
            Math.PI * 2
          );


        item.pulseSpeed =
          random(
            0.0005,
            0.0010
          );


        /*
          Begin faint and fade in
          as it returns.
        */

        item.el.style.opacity =
          0;

      }

    }
  );


  requestAnimationFrame(
    animate
  );

}



/* =========================================================
   START ANIMATION
   ========================================================= */

requestAnimationFrame(
  animate
);


</script>

</body>

</html>
