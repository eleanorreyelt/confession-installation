<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<title>Take Up Space</title>

<style>

/* =========================================================
   BASIC
   ========================================================= */

:root{
  --navy:#192142;
  --blue:#677AC5;
  --app-height:100dvh;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;
  background:var(--navy);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow:hidden;
}


/* =========================================================
   ENTRY PAGE
   ========================================================= */

#entry{

  position:fixed;
  inset:0;

  width:100%;
  height:var(--app-height);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    calc(24px + env(safe-area-inset-top))
    calc(22px + env(safe-area-inset-right))
    calc(24px + env(safe-area-inset-bottom))
    calc(22px + env(safe-area-inset-left));

  background:var(--navy);
  color:var(--blue);

  overflow:hidden;

  z-index:20;

  transition:
    opacity 1.2s ease,
    visibility 1.2s ease;
}


#entry.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}


.entry-inner{

  width:min(
    680px,
    100%
  );

}


/* =========================================================
   ENTRY TEXT
   ========================================================= */

h1{

  font-size:
    clamp(
      36px,
      6.5vw,
      70px
    );

  font-weight:400;

  line-height:.91;

  letter-spacing:-.055em;

  margin:
    0 0 20px;

  max-width:700px;
}


.intro{

  font-size:17px;

  line-height:1.38;

  max-width:560px;

  margin:
    0 0 20px;
}


/* =========================================================
   TEXTAREA
   ========================================================= */

#input{

  display:block;

  width:100%;

  height:120px;

  min-height:120px;

  resize:none;

  border:
    1px solid var(--blue);

  background:transparent;

  color:var(--blue);

  padding:14px;

  font:inherit;

  font-size:17px;

  line-height:1.35;

  outline:none;
}


#input::placeholder{

  color:var(--blue);

  opacity:.55;

}


#input:focus{

  box-shadow:
    0 0 0 2px
    rgba(
      103,
      122,
      197,
      .35
    );

}


/* =========================================================
   CHARACTER COUNT
   ========================================================= */

#counter{

  margin-top:5px;

  color:var(--blue);

  opacity:.5;

  font-size:11px;

}


/* =========================================================
   ENTRY BUTTONS
   ========================================================= */

.entry-bottom{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:14px;

  margin-top:8px;
}


button{

  border:0;

  background:var(--blue);

  color:var(--navy);

  padding:
    12px 20px;

  min-height:46px;

  font:inherit;

  font-size:16px;

  cursor:pointer;
}


button:disabled{

  opacity:.45;

  cursor:default;
}


#status{

  font-size:13px;

  min-height:18px;
}


#enterSpace{

  display:block;

  width:auto;

  margin-top:9px;

  background:transparent;

  border:
    1px solid
    var(--blue);

  color:var(--blue);

  padding:
    10px 16px;

  min-height:44px;

  font-size:14px;
}


#enterSpace:hover{

  background:var(--blue);

  color:var(--navy);

}


/* =========================================================
   SHARED SPACE
   ========================================================= */

#space{

  position:fixed;

  inset:0;

  width:100%;

  height:var(--app-height);

  overflow:hidden;

  background:var(--navy);

  opacity:0;

  pointer-events:none;

  transition:
    opacity 1.5s ease;

  z-index:10;
}


#space.visible{

  opacity:1;

  pointer-events:auto;

}


/* =========================================================
   VIDEO
   ========================================================= */

#backgroundVideo{

  position:absolute;

  inset:0;

  display:block;

  width:100%;

  height:100%;

  object-fit:cover;

  z-index:0;

  opacity:.72;

  filter:blur(1px);

  transform:scale(1.015);

  pointer-events:none;
}


/* =========================================================
   VIDEO OVERLAY
   ========================================================= */

#videoOverlay{

  position:absolute;

  inset:0;

  z-index:1;

  background:
    rgba(
      25,
      33,
      66,
      .58
    );

  pointer-events:none;
}


/* =========================================================
   CONFESSION LAYER
   ========================================================= */

#wordLayer{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  z-index:5;

  overflow:hidden;

  pointer-events:none;

}


/* =========================================================
   DESKTOP CONFESSIONS
   ========================================================= */

.word{

  position:absolute;

  left:0;

  top:0;

  z-index:5;

  color:var(--blue);

  font-size:
    clamp(
      31px,
      3vw,
      40px
    );

  line-height:1.06;

  font-weight:400;

  letter-spacing:-.035em;

  white-space:normal;

  width:max-content;

  max-width:min(
    38vw,
    620px
  );

  opacity:0;

  pointer-events:none;

  will-change:
    transform,
    opacity;

  transform-origin:
    center center;

}


.word.appearing{

  animation:
    confessionIn
    1.8s
    ease-out
    forwards;

}


@keyframes confessionIn{

  from{
    opacity:0;
  }

  to{
    opacity:.88;
  }

}


.word.fading{

  animation:
    confessionOut
    1.4s
    ease-in
    forwards;

}


@keyframes confessionOut{

  from{
    opacity:.88;
  }

  to{
    opacity:0;
  }

}


/* =========================================================
   BACK BUTTON
   ========================================================= */

#back{

  position:absolute;

  z-index:30;

  top:
    calc(
      14px +
      env(safe-area-inset-top)
    );

  left:
    calc(
      14px +
      env(safe-area-inset-left)
    );

      122,
      197,
      .45

      33,

/* =========================================================

/* =========================================================

   ========================================================= */

#moderate{

  top:

      14px +
      env(safe-area-inset-top)

  right:

      33,

/* =========================================================

#moderationStatus{

#adminList{

  margin-top:12px;

      103,
      122,
      197,
      .35

  padding:

  document.documentElement.style
    .setProperty(
      "--app-height",

/* =========================================================

   ========================================================= */

const MAX_VISIBLE_PHONE =

const MAX_VISIBLE_TABLET =

/* =========================================================
   DEVICE CHECK
   ========================================================= */

function isPhone(){

  return window.innerWidth <= 600;

}


/* =========================================================
   VISIBLE COUNT
   ========================================================= */

function getVisibleCount(){

  const width =
    window.innerWidth;


  if(width <= 600){

    return MAX_VISIBLE_PHONE;

  }


  if(width <= 1100){

    return MAX_VISIBLE_TABLET;

  }


  return MAX_VISIBLE_DESKTOP;

}


/* =========================================================
   RANDOM
   ========================================================= */

function random(
  min,
  max
){

  return Math.random()
    * (max - min)
    + min;

}


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(
  array
){

  const copy =
    [...array];


  for(
    let i =
      copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()
        * (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}


/* =========================================================
   FONT SIZE
   ========================================================= */

function getFontSize(
  text
){

  const length =
    text.length;


  if(length > 400){

    return random(
      21,
      24
    );

  }


  if(length > 300){

    return random(
      23,
      27
    );

  }


  if(length > 200){

    return random(
      25,
      30
    );

  }


  if(length > 120){

    return random(
      28,
      33
    );

  }


  return random(
    31,
    40
  );

}


/* =========================================================
   RECTANGLES
   ========================================================= */

function getItemRect(
  item
){

  return {

    left:
      item.x,

    top:
      item.y,

    right:
      item.x +
      item.width,

    bottom:
      item.y +
      item.height

  };

}


function rectanglesOverlap(
  a,
  b,
  gap = 50
){

  return !(
    a.right + gap < b.left ||
    a.left - gap > b.right ||
    a.bottom + gap < b.top ||
    a.top - gap > b.bottom
  );

}


/* =========================================================
   INITIAL DESKTOP POSITION
   ========================================================= */

function findInitialPosition(
  width,
  height
){

  const screenWidth =
    wordLayer.clientWidth;


  const screenHeight =
    wordLayer.clientHeight;


  for(
    let attempt = 0;
    attempt < SPAWN_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        20,
        Math.max(
          20,
          screenWidth -
          width -
          20
        )
      );


    const y =
      random(
        20,
        Math.max(
          20,
          screenHeight -
          height -
          20
        )
      );


    const candidate = {

      left:x,

      top:y,

      right:x + width,

      bottom:y + height

    };


    let collision =
      false;


    activeItems.forEach(
      other => {

        const otherRect =
          getItemRect(
            other
          );


        if(
          rectanglesOverlap(
            candidate,
            otherRect
          )
        ){

          collision =
            true;

        }

      }
    );


    if(!collision){

      return {
        x,
        y
      };

    }

  }


  return {

    x:
      random(
        20,
        Math.max(
          20,
          screenWidth -
          width -
          20
        )
      ),

    y:
      random(
        20,
        Math.max(
          20,
          screenHeight -
          height -
          20
        )
      )

  };

}


/* =========================================================
   DESKTOP SPAWN POSITION
   ========================================================= */

function findSpawnPosition(
  width,
  height
){

  const screenWidth =
    wordLayer.clientWidth;


  const spawnY =
    -height -
    30;


  for(
    let attempt = 0;
    attempt < SPAWN_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        20,
        Math.max(
          20,
          screenWidth -
          width -
          20
        )
      );


    const candidate = {

      left:x,

      top:spawnY,

      right:x + width,

      bottom:spawnY + height

    };


    let collision =
      false;


    activeItems.forEach(
      other => {

        const rect =
          getItemRect(
            other
          );


        if(
          rectanglesOverlap(
            candidate,
            rect,
            70
          )
        ){

          collision =
            true;

        }

      }
    );


    if(!collision){

      return {

        x,

        y:spawnY

      };

    }

  }


  return {

    x:
      random(
        20,
        Math.max(
          20,
          screenWidth -
          width -
          20
        )
      ),

    y:spawnY

  };

}


/* =========================================================
   CREATE DESKTOP CONFESSION
   ========================================================= */

function createActiveWord(
  id,
  mode = "spawn"
){

  if(
    activeItems.has(id)
  ){

    return null;

  }


  const data =
    confessions.get(id);


  if(
    !data ||
    typeof data.text !== "string"
  ){

    return null;

  }


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "word";


  el.dataset.id =
    id;


  el.textContent =
    data.text;


  el.style.fontSize =
    `${getFontSize(
      data.text
    )}px`;


  wordLayer.appendChild(
    el
  );


  const width =
    el.offsetWidth;


  const height =
    el.offsetHeight;


  let position;


  if(mode === "initial"){

    position =
      findInitialPosition(
        width,
        height
      );

  }else{

    position =
      findSpawnPosition(
        width,
        height
      );

  }


  const item = {

    id,

    el,

    x:
      position.x,

    y:
      position.y,

    width,

    height,

    opacity:
      mode === "initial"
        ? .72
        : 0,

    removing:
      false

  };


  activeItems.set(
    id,
    item
  );


  el.style.transform =
    `translate3d(
      ${item.x}px,
      ${item.y}px,
      0
    )`;


  el.style.opacity =
    item.opacity;


  if(mode !== "initial"){

    requestAnimationFrame(
      () => {

        el.classList.add(
          "appearing"
        );

      }
    );

  }


  if(adminUnlocked){

    makeWordModeratable(
      item
    );

  }


  empty.style.display =
    "none";


  return item;

}


/* =========================================================
   MODERATION CLICK
   ========================================================= */

function makeWordModeratable(
  item
){

  item.el.classList.add(
    "moderatable"
  );


  item.el.onclick =
    () => {

      selectConfession(
        item.id
      );

    };

}


/* =========================================================
   REMOVE DESKTOP WORD
   ========================================================= */

function removeActiveWord(
  id,
  recycle = true
){

  const item =
    activeItems.get(
      id
    );


  if(!item){

    return;

  }


  item.removing =
    true;


  activeItems.delete(
    id
  );


  item.el.classList.remove(
    "appearing"
  );


  item.el.classList.add(
    "fading"
  );


  setTimeout(
    () => {

      item.el.remove();

    },
    1400
  );


  if(
    recycle &&
    confessions.has(id)
  ){

    addNextWord();

  }

}


/* =========================================================
   CYCLE
   ========================================================= */

function startNewCycle(){

  cycleQueue =
    shuffle(
      [...confessions.keys()]
    );


  queueIndex =
    0;


  cycleStarted =
    cycleQueue.length > 0;

}


function getNextConfessionId(){

  if(
    confessions.size === 0
  ){

    return null;

  }


  if(
    !cycleStarted ||
    queueIndex >=
    cycleQueue.length
  ){

    startNewCycle();

  }


  let attempts =
    0;


  while(
    attempts <
    cycleQueue.length + 5
  ){

    if(
      queueIndex >=
      cycleQueue.length
    ){

      startNewCycle();

    }


    const id =
      cycleQueue[
        queueIndex
      ];


    queueIndex++;


    if(
      confessions.has(id) &&
      !activeItems.has(id)
    ){

      return id;

    }


    attempts++;

  }


  return null;

}


/* =========================================================
   NEXT DESKTOP WORD
   ========================================================= */

function addNextWord(){

  const id =
    getNextConfessionId();


  if(!id){

    return;

  }


  createActiveWord(
    id,
    "spawn"
  );

}


/* =========================================================
   FILL DESKTOP SPACE
   ========================================================= */

function fillInitialSpace(){

  const target =
    Math.min(
      getVisibleCount(),
      confessions.size
    );


  if(
    !cycleStarted
  ){

    startNewCycle();

  }


  let created =
    0;


  while(
    created <
    target
  ){

    const id =
      getNextConfessionId();


    if(!id){

      break;

    }


    createActiveWord(
      id,
      "initial"
    );


    created++;

  }

}


/* =========================================================
   MAINTAIN DESKTOP COUNT
   ========================================================= */

function maintainVisibleCount(){

  const target =
    Math.min(
      getVisibleCount(),
      confessions.size
    );


  while(
    activeItems.size <
    target
  ){

    const id =
      getNextConfessionId();


    if(!id){

      break;

    }


    createActiveWord(
      id,
      "spawn"
    );

  }

}


/* =========================================================
   PHONE FEED
   ========================================================= */

function renderMobileFeed(
  preserveScroll = true
){

  if(
    !isPhone()
  ){

    return;

  }


  const previousScroll =
    wordLayer.scrollTop;


  wordLayer.innerHTML =
    "";


  const sorted =
    [...confessions.entries()]
      .sort(
        (a,b) =>
          (a[1].createdAt || 0) -
          (b[1].createdAt || 0)
      );


  if(sorted.length === 0){

    empty.style.display =
      "flex";

    return;

  }


  empty.style.display =
    "none";


  sorted.forEach(
    ([id,data]) => {

      const el =
        document.createElement(
          "div"
        );


      el.className =
        "word";


      el.dataset.id =
        id;


      el.textContent =
        data.text;


      const fontSize =
        Math.min(
          getFontSize(
            data.text
          ),
          27
        );


      el.style.fontSize =
        `${fontSize}px`;


      wordLayer.appendChild(
        el
      );


      if(adminUnlocked){

        const item = {

          id,

          el

        };


        makeWordModeratable(
          item
        );

      }

    }
  );


  if(
    preserveScroll
  ){

    requestAnimationFrame(
      () => {

        wordLayer.scrollTop =
          previousScroll;

      }
    );

  }

}


/* =========================================================
   DATA SYNC
   ========================================================= */

onValue(
  confessionRef,
  snapshot => {

    const raw =
      snapshot.val()
      || {};


    const incomingIds =
      new Set(
        Object.keys(
          raw
        )
      );


    const previousIds =
      new Set(
        confessions.keys()
      );


    /* -----------------------------------------------
       Deleted entries
       ----------------------------------------------- */

    previousIds.forEach(
      id => {

        if(
          !incomingIds.has(id)
        ){

          removeActiveWord(
            id,
            false
          );


          cycleQueue =
            cycleQueue.filter(
              queuedId =>
                queuedId !== id
            );


          confessions.delete(
            id
          );

        }

      }
    );


    /* -----------------------------------------------
       Add or update entries
       ----------------------------------------------- */

    incomingIds.forEach(
      id => {

        const data =
          raw[id];


        if(
          !data ||
          typeof data.text !== "string"
        ){

          return;

        }


        confessions.set(
          id,
          {

            text:
              data.text,

            createdAt:
              Number(
                data.createdAt
              ) || 0

          }
        );


        if(
          !cycleQueue.includes(id) &&
          !activeItems.has(id)
        ){

          cycleQueue.push(
            id
          );

        }

      }
    );


    /* -----------------------------------------------
       PHONE
       ----------------------------------------------- */

    if(
      isPhone()
    ){

      renderMobileFeed(
        space.classList.contains(
          "visible"
        )
      );


      if(
        adminUnlocked
      ){

        buildAdminList();

      }


      return;

    }


    /* -----------------------------------------------
       DESKTOP
       ----------------------------------------------- */

    if(
      confessions.size === 0
    ){

      empty.style.display =
        "flex";

      return;

    }


    empty.style.display =
      "none";


    if(
      !cycleStarted
    ){

      fillInitialSpace();

    }else{

      maintainVisibleCount();

    }


    if(
      adminUnlocked
    ){

      buildAdminList();

    }

  }
);


/* =========================================================
   ANIMATION
   ========================================================= */

let lastFrame =
  performance.now();


function animate(
  now
){

  const delta =
    Math.min(
      .05,
      (
        now -
        lastFrame
      ) /
      1000
    );


  lastFrame =
    now;


  if(
    !isPhone()
  ){

    const screenHeight =
      wordLayer.clientHeight;


    const items =
      [...activeItems.values()];


    items.forEach(
      item => {

        if(
          item.removing
        ){

          return;

        }


        item.y +=
          FALL_SPEED *
          delta;


        const fadeStart =
          screenHeight *
          .78;


        const fadeDistance =
          screenHeight *
          .22;


        if(
          item.y >
          fadeStart
        ){

          const progress =
            Math.min(
              1,
              (
                item.y -
                fadeStart
              ) /
              fadeDistance
            );


          item.opacity =
            .88 *
            (1 - progress);

        }else{

          item.opacity =
            .88;

        }


        item.el.style.transform =
          `translate3d(
            ${item.x}px,
            ${item.y}px,
            0
          )`;


        item.el.style.opacity =
          item.opacity;


        if(
          item.y >
          screenHeight + 40
        ){

          removeActiveWord(
            item.id,
            true
          );

        }

      }
    );

  }


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);


/* =========================================================
   SHOW SPACE
   ========================================================= */

function showSpace(){

  updateViewportHeight();


  entry.classList.add(
    "hidden"
  );


  space.classList.add(
    "visible"
  );


  startVideo();


  if(
    isPhone()
  ){

    requestAnimationFrame(
      () => {

        renderMobileFeed(
          false
        );

        wordLayer.scrollTop =
          0;

      }
    );

  }else{

    if(
      activeItems.size === 0
    ){

      fillInitialSpace();

    }

  }

}


/* =========================================================
   SHOW ENTRY
   ========================================================= */

function showEntry(){

  space.classList.remove(
    "visible"
  );


  entry.classList.remove(
    "hidden"
  );


  updateViewportHeight();


  release.disabled =
    false;


  status.textContent =
    "";


  setTimeout(
    () => {

      input.focus();

    },
    200
  );

}


/* =========================================================
   ENTER SHARED SPACE
   ========================================================= */

enterSpace.addEventListener(
  "click",
  () => {

    showSpace();

  }
);


/* =========================================================
   COUNTER
   ========================================================= */

input.addEventListener(
  "input",
  () => {

    counter.textContent =
      `${input.value.length} / 500`;

  }
);


/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const text =
      input.value
        .trim()
        .replace(
          /\s+/g,
          " "
        );


    if(!text){

      return;

    }


    if(
      text.length > 500
    ){

      status.textContent =
        "Your confession is too long.";


      return;

    }


    release.disabled =
      true;


    status.textContent =
      "Releasing…";


    try{

      await push(
        confessionRef,
        {

          text,

          createdAt:
            Date.now()

        }
      );


      input.value =
        "";


      counter.textContent =
        "0 / 500";


      status.textContent =
        "";


      showSpace();


    }catch(error){

      console.error(
        "Submission error:",
        error
      );


      status.textContent =
        "Something went wrong. Try again.";


      release.disabled =
        false;

    }

  }
);


/* =========================================================
   BACK
   ========================================================= */

back.addEventListener(
  "click",
  () => {

    showEntry();

  }
);


/* =========================================================
   SELECT CONFESSION
   ========================================================= */

function selectConfession(
  id
){

  selectedId =
    id;


  document
    .querySelectorAll(
      ".word"
    )
    .forEach(
      word => {

        word.classList.remove(
          "selected"
        );

      }
    );


  const selectedWord =
    document.querySelector(
      `.word[data-id="${CSS.escape(id)}"]`
    );


  if(selectedWord){

    selectedWord.classList.add(
      "selected"
    );

  }


  document
    .querySelectorAll(
      ".modItem"
    )
    .forEach(
      row => {

        row.classList.toggle(
          "selected",
          row.dataset.id === id
        );

      }
    );


  deleteButton.style.display =
    "block";

}


/* =========================================================
   ADMIN LIST
   ========================================================= */

function buildAdminList(){

  adminList.innerHTML =
    "";


  const sorted =
    [...confessions.entries()]
      .sort(
        (a,b) =>
          (b[1].createdAt || 0) -
          (a[1].createdAt || 0)
      );


  sorted.forEach(
    ([id,data]) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "modItem";


      row.dataset.id =
        id;


      row.textContent =
        data.text;


      row.addEventListener(
        "click",
        () => {

          selectConfession(
            id
          );

        }
      );


      adminList.appendChild(
        row
      );

    }
  );

}


/* =========================================================
   MODERATION TOGGLE
   ========================================================= */

moderate.addEventListener(
  "click",
  () => {

    moderationPanel.classList.toggle(
      "open"
    );


    if(
      moderationPanel.classList.contains(
        "open"
      )
    ){

      adminPin.focus();


      if(adminUnlocked){

        buildAdminList();

      }

    }

  }
);


/* =========================================================
   MODERATION LOGIN
   ========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    if(
      adminPin.value ===
      ADMIN_PIN
    ){

      adminUnlocked =
        true;


      adminPin.value =
        "";


      adminList.style.display =
        "block";


      moderationStatus.textContent =
        "Moderation unlocked. Select a confession to delete it.";


      buildAdminList();


      if(
        isPhone()
      ){

        renderMobileFeed(
          true
        );

      }else{

        activeItems.forEach(
          item => {

            makeWordModeratable(
              item
            );

          }
        );

      }

    }else{

      moderationStatus.textContent =
        "Incorrect PIN.";


      adminUnlocked =
        false;

    }

  }
);


/* =========================================================
   DELETE
   ========================================================= */

deleteButton.addEventListener(
  "click",
  async () => {

    if(
      !adminUnlocked ||
      !selectedId
    ){

      return;

    }


    const data =
      confessions.get(
        selectedId
      );


    if(!data){

      return;

    }


    if(
      !window.confirm(
        "Delete this confession from the shared space?"
      )
    ){

      return;

    }


    try{

      await remove(
        ref(
          database,
          "confessions/" +
          selectedId
        )
      );


      selectedId =
        null;


      deleteButton.style.display =
        "none";


      moderationStatus.textContent =
        "Confession deleted.";


    }catch(error){

      console.error(
        "Delete failed:",
        error
      );


      moderationStatus.textContent =
        "Delete failed. Check Firebase rules.";

    }

  }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  () => {

    updateViewportHeight();


    if(
      isPhone()
    ){

      renderMobileFeed(
        true
      );

    }else{

      maintainVisibleCount();

    }

  }
);

</script>
