   BASIC
   ========================================================= */

html,

/* =========================================================
   ENTRY PAGE
   ========================================================= */

#entry{

  z-index:20;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#677AC5;

#entry.hidden{

.entry-inner{

h1{

  line-height:.92;

.intro{

}


textarea{

  min-height:190px;

  resize:vertical;

  border:

  background:#192142;

  color:#677AC5;

  padding:18px;

  font:inherit;

  font-size:19px;

  line-height:1.35;

  outline:none;
}


textarea::placeholder{
  color:#677AC5;

  opacity:.55;
}


textarea:focus{

}


.entry-bottom{
  display:flex;

  justify-content:space-between;

  gap:16px;

button{
  border:0;

  background:#677AC5;

#status{

#enterSpace{

    12px 18px;

  font-size:14px;

}


#enterSpace:hover{

  background:#677AC5;

  color:#192142;

}



/* =========================================================
   SHARED SPACE
   ========================================================= */

#space{

  position:absolute;

  inset:0;

  width:100%;
  height:100dvh;

  overflow:hidden;

  background:#192142;

  opacity:0;

  pointer-events:none;

  transition:
    opacity 1.5s ease;
}


#space.visible{

  opacity:1;

  pointer-events:auto;

}



/* =========================================================
   VIDEO
   ========================================================= */

#backgroundVideo{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:0;

  opacity:.72;

  filter:blur(1px);

  transform:scale(1.015);

  pointer-events:none;

}



/* =========================================================

   ========================================================= */

#videoOverlay{

  inset:0;

  z-index:1;

      33,
      66,
      .58

  pointer-events:none;

}



/* =========================================================
   CONFESSIONS
   ========================================================= */

.word{

  left:0;

  top:0;

  z-index:5;

  font-size:

    Long confessions wrap instead

  white-space:normal;

  );

  opacity:0;

  pointer-events:none;

  transform-origin:

#back{

/* =========================================================

#empty{

/* =========================================================

/* =========================================================
   VIDEO WITH SOUND
   ========================================================= */

function startVideo(){

  /*
    Sound is enabled here.

    This function is called from a
    visitor interaction, which gives
    the browser the best opportunity
    to allow audible playback.
  */

  backgroundVideo.muted =
    false;


  backgroundVideo.volume =
    1;


  const playPromise =
    backgroundVideo.play();


  if(
    playPromise &&
    typeof playPromise.catch ===
    "function"
  ){

    playPromise.catch(
      error => {

        console.log(
          "Video playback was blocked:",
          error
        );

      }
    );

}



/* =========================================================
   MODERATION
   ========================================================= */

const ADMIN_PIN =
  "0092";


let adminUnlocked =
  false;


let selectedId =
  null;



/* =========================================================
   PROJECTION SETTINGS
   ========================================================= */

/*
  Maximum number of confessions
  visible at one time.

  The actual number changes
  depending on screen size.
*/

function getVisibleCount(){

  const width =
    window.innerWidth;


  if(
    width <= 600
  ){

    return 6;

  }


  if(
    width <= 1000
  ){

    return 10;

  }


  return 16;

}


/*
  All confessions use the same
  falling speed.

  This prevents one confession
  from catching another.
*/

const FALL_SPEED =
  0.018;


/*
  Extra space around each
  confession's bounding box.
*/

const WORD_GAP =
  70;


/*
  Number of attempts used when
  finding an open location.
*/

const PLACEMENT_ATTEMPTS =
  300;



/* =========================================================
   CONFESSION DATA
   ========================================================= */

/*
  ALL submissions live here.

  They are NOT limited to the number
  currently visible.
*/

const confessions =
  new Map();


/*
  Currently visible confession
  objects.
*/

const activeItems =
  [];


/*
  Randomized order through which
  every confession eventually appears.
*/

let cycleQueue =
  [];


let queueIndex =
  0;


/*
  Prevent initial setup from happening
  before Firebase has loaded the data.
*/

let projectionInitialized =
  false;



/* =========================================================
   RANDOM
   ========================================================= */

function random(
  min,
  max
){

  return (
    Math.random() *
    (max - min)
  ) + min;

}



/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(
  array
){

  const copy =
    [...array];


  for(
    let i=copy.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );


    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}



/* =========================================================
   FONT SIZE
   ========================================================= */

function getFontSize(
  text
){

  const length =
    text.length;


  /*
    Long confessions remain
    readable.
  */

  if(
    length > 400
  ){

    return random(
      21,
      24
    );

  }


  if(
    length > 300
  ){

    return random(
      23,
      27
    );

  }


  if(
    length > 200
  ){

    return random(
      25,
      30
    );

  }


  if(
    length > 120
  ){

    return random(
      28,
      33
    );

  }


  return random(
    31,
    40
  );

}



/* =========================================================
   RECTANGLE
   ========================================================= */

function getRect(
  x,
  y,
  width,
  height
){

  return {

    left:x,

    top:y,

    right:
      x + width,

    bottom:
      y + height

  };

}



/* =========================================================
   COLLISION
   ========================================================= */

function rectanglesOverlap(
  a,
  b,
  gap
){

  return !(
    a.right + gap <= b.left ||
    a.left >= b.right + gap ||
    a.bottom + gap <= b.top ||
    a.top >= b.bottom + gap
  );

}



/* =========================================================
   INITIAL OPEN POSITION
   ========================================================= */

function findInitialPosition(
  width,
  height
){

  const spaceWidth =
    space.clientWidth;


  const spaceHeight =
    space.clientHeight;


  let bestPosition =
    null;


  /*
    Try many random locations.
  */

  for(
    let attempt=0;
    attempt<PLACEMENT_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        10,
        Math.max(
          11,
          spaceWidth -
          width -
          10
        )
      );


    const y =
      random(
        10,
        Math.max(
          11,
          spaceHeight -
          height -
          10
        )
      );


    const candidate =
      getRect(
        x,
        y,
        width,
        height
      );


    let blocked =
      false;


    for(
      const item of activeItems
    ){

      const itemRect =
        getRect(
          item.x,
          item.y,
          item.el.offsetWidth,
          item.el.offsetHeight
        );


      if(
        rectanglesOverlap(
          candidate,
          itemRect,
          WORD_GAP
        )
      ){

        blocked =
          true;

        break;

      }

    }


    if(
      !blocked
    ){

      return {
        x,
        y
      };

    }


    /*
      Keep a fallback in case the
      screen is becoming crowded.
    */

    if(
      !bestPosition
    ){

      bestPosition = {
        x,
        y
      };

    }

  }


  return (
    bestPosition || {

      x:
        random(
          10,
          Math.max(
            11,
            spaceWidth -
            width -
            10
          )
        ),

      y:
        random(
          10,
          Math.max(
            11,
            spaceHeight -
            height -
            10
          )
        )

    }
  );

}



/* =========================================================
   TOP SPAWN POSITION
   ========================================================= */

/*
  Finds the highest possible entry
  point above the screen.

  Because every confession falls at
  the same speed, a confession that
  starts above another confession
  maintains that separation.
*/

function findSpawnPosition(
  width,
  height,
  ignoreItem=null
){

  const spaceWidth =
    space.clientWidth;


  let best =
    null;


  /*
    Try lots of horizontal positions.
  */

  for(
    let attempt=0;
    attempt<PLACEMENT_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        0,
        Math.max(
          1,
          spaceWidth -
          width
        )
      );


    /*
      Start immediately above
      the visible frame.
    */

    let y =
      -height -
      20;


    const candidateLeft =
      x;


    const candidateRight =
      x + width;


    /*
      If another active confession
      occupies the same horizontal
      path, put this one high enough
      above it to preserve separation.
    */

    for(
      const item of activeItems
    ){

      if(
        item === ignoreItem
      ){

        continue;

      }


      const itemLeft =
        item.x;


      const itemRight =
        item.x +
        item.el.offsetWidth;


      const horizontalOverlap =
        !(
          candidateRight +
          WORD_GAP <=
          itemLeft
          ||
          candidateLeft >=
          itemRight +
          WORD_GAP
        );


      if(
        horizontalOverlap
      ){

        y =
          Math.min(
            y,
            item.y -
            height -
            WORD_GAP
          );

      }

    }


    /*
      We want the highest possible
      position, meaning the largest
      Y value.
    */

    if(
      !best ||
      y > best.y
    ){

      best = {
        x,
        y
      };

    }


    /*
      A position immediately above
      the frame is ideal, so stop
      searching when we find one.
    */

    if(
      y >=
      -height -
      25
    ){

      return {
        x,
        y
      };

    }

  }


  return (
    best || {

      x:
        random(
          0,
          Math.max(
            1,
            spaceWidth -
            width
          )
        ),

      y:
        -height -
        20

    }
  );

}



/* =========================================================
   PREPARE CONFESSION
   ========================================================= */

function prepareElement(
  item,
  id,
  text
){

  item.id =
    id;


  item.el.dataset.id =
    id;


  item.el.textContent =
    text;


  item.el.style.fontSize =
    getFontSize(text) +
    "px";


  /*
    Force layout so the dimensions
    are accurate.
  */

  item.el.offsetWidth;


  item.el.offsetHeight;

}



/* =========================================================
   GET NEXT CONFESSION
   ========================================================= */

function getNextConfessionId(){

  if(
    confessions.size === 0
  ){

    return null;

  }


  /*
    Current visible IDs.
  */

  const activeIds =
    new Set(
      activeItems.map(
        item =>
          item.id
      )
    );


  /*
    Keep looking through the
    current randomized cycle.
  */

  let checked =
    0;


  while(
    checked <
    confessions.size * 2
  ){

    if(
      queueIndex >=
      cycleQueue.length
    ){

      cycleQueue =
        shuffle(
          Array.from(
            confessions.keys()
          )
        );


      queueIndex =
        0;

    }


    if(
      cycleQueue.length === 0
    ){

      return null;

    }


    const id =
      cycleQueue[
        queueIndex
      ];


    queueIndex++;


    checked++;


    /*
      Database entry could have
      been deleted since the queue
      was created.
    */

    if(
      !confessions.has(id)
    ){

      continue;

    }


    /*
      Don't show a confession twice
      at the same time when there are
      alternatives.
    */

    if(
      activeIds.has(id) &&
      confessions.size >
      activeItems.length
    ){

      continue;

    }


    return id;

  }


  /*
    Fallback.

    This only happens when there
    aren't enough unique submissions
    to fill every visible slot.
  */

  const available =
    Array.from(
      confessions.keys()
    ).filter(
      id =>
        !activeIds.has(id)
    );


  if(
    available.length
  ){

    return (
      available[
        Math.floor(
          Math.random() *
          available.length
        )
      ]
    );

  }


  return (
    Array.from(
      confessions.keys()
    )[0] ||
    null
  );

}



/* =========================================================
   CREATE ACTIVE WORD
   ========================================================= */

function createActiveWord(
  id,
  initial=false
){

  const data =
    confessions.get(id);


  if(
    !data
  ){

    return null;

  }


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "word";


  space.appendChild(
    el
  );


  const item = {

    id,

    el,

    x:0,

    y:0,

    speed:
      FALL_SPEED,

    pulseOffset:
      random(
        0,
        Math.PI * 2
      ),

    pulseSpeed:
      random(
        0.0005,
        0.0010
      ),

    opacityBase:
      random(
        0.48,
        0.72
      )

  };


  prepareElement(
    item,
    id,
    data.text
  );


  const width =
    el.offsetWidth;


  const height =
    el.offsetHeight;


  let position;


  if(
    initial
  ){

    position =
      findInitialPosition(
        width,
        height
      );

  }else{

    position =
      findSpawnPosition(
        width,
        height
      );

  }


  item.x =
    position.x;


  item.y =
    position.y;


  /*
    New confessions are slightly
    stronger.
  */

  if(
    !initial
  ){

    item.opacityBase =
      0.82;

  }


  activeItems.push(
    item
  );


  /*
    Make the confession clickable
    when moderation is unlocked.

    The handler always reads the
    item's current ID, so it still
    works when the element is reused.
  */

  el.addEventListener(
    "click",
    () => {

      if(
        !adminUnlocked
      ){

        return;

      }


      selectConfession(
        item.id
      );

    }
  );


  return item;

}



/* =========================================================
   ACTIVATE NEXT CONFESSION
   ========================================================= */

function recycleItem(
  item
){

  const oldId =
    item.id;


  /*
    Don't choose the same confession
    immediately unless there are no
    alternatives.
  */

  let nextId =
    getNextConfessionId();


  if(
    !nextId
  ){

    return;

  }


  /*
    If there are several submissions,
    make sure we don't immediately
    recycle the exact same one.
  */

  if(
    confessions.size > 1 &&
    nextId === oldId
  ){

    const alternatives =
      Array.from(
        confessions.keys()
      ).filter(
        id =>
          id !== oldId
      );


    if(
      alternatives.length
    ){

      nextId =
        alternatives[
          Math.floor(
            Math.random() *
            alternatives.length
          )
        ];

    }

  }


  /*
    Keep the item in the active
    array but change its identity.
  */

  wordItems.delete(
    oldId
  );


  prepareElement(
    item,
    nextId,
    confessions.get(
      nextId
    ).text
  );


  const width =
    item.el.offsetWidth;


  const height =
    item.el.offsetHeight;


  const position =
    findSpawnPosition(
      width,
      height,
      item
    );


  item.x =
    position.x;


  item.y =
    position.y;


  item.speed =
    FALL_SPEED;


  item.pulseOffset =
    random(
      0,
      Math.PI * 2
    );


  item.pulseSpeed =
    random(
      0.0005,
      0.0010
    );


  item.opacityBase =
    0.70;


  item.el.style.opacity =
    0;


  wordItems.set(
    nextId,
    item
  );


  /*
    If the moderator had selected
    the old confession, clear it.
  */

  if(
    selectedId === oldId
  ){

    selectedId =
      null;


    deleteButton.style.display =
      "none";

  }


  buildAdminList();

}



/* =========================================================
   WORD MAP
   ========================================================= */

const wordItems =
  new Map();



/* =========================================================
   SHOW SPACE
   ========================================================= */

function showSpace(){

  entry.classList.add(
    "hidden"
  );


  space.classList.add(
    "visible"
  );


  startVideo();

}



/* =========================================================
   SHOW ENTRY
   ========================================================= */

function showEntry(){

  space.classList.remove(
    "visible"
  );


  entry.classList.remove(
    "hidden"
  );


  input.focus();

}



/* =========================================================
   ENTER SHARED SPACE
   ========================================================= */

enterSpace.addEventListener(
  "click",
  () => {

    showSpace();

  }
);



/* =========================================================
   SUBMIT CONFESSION
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    /*
      Start video immediately from
      the visitor's interaction.
    */

    startVideo();


    const text =
      input.value
        .trim()
        .replace(
          /\s+/g,
          " "
        );


    if(
      !text
    ){

      return;

    }


    release.disabled =
      true;


    status.textContent =
      "Releasing…";


    try{

      await push(
        confessionRef,
        {

          text,

          createdAt:
            Date.now()

        }
      );


      input.value =
        "";


      status.textContent =
        "";


      showSpace();


    }catch(error){

      console.error(
        "Submission error:",
        error
      );


      status.textContent =
        "Something went wrong. Try again.";


      release.disabled =
        false;

    }

  }
);



/* =========================================================
   BACK
   ========================================================= */

back.addEventListener(
  "click",
  () => {

    showEntry();


    release.disabled =
      false;


    status.textContent =
      "";

  }
);



/* =========================================================
   FIREBASE REAL-TIME DATA
   ========================================================= */

onValue(
  confessionRef,
  snapshot => {

    const incoming =
      new Map();


    snapshot.forEach(
      child => {

        const data =
          child.val();


        if(
          data &&
          typeof data.text ===
          "string"
        ){

          incoming.set(
            child.key,
            {

              text:
                data.text,

              createdAt:
                data.createdAt ||
                0

            }
          );

        }

      }
    );


    /*
      ---------------------------------
      INITIAL LOAD
      ---------------------------------
    */

    if(
      !projectionInitialized
    ){

      incoming.forEach(
        (data,id) => {

          confessions.set(
            id,
            data
          );

        }
      );


      cycleQueue =
        shuffle(
          Array.from(
            confessions.keys()
          )
        );


      queueIndex =
        0;


      projectionInitialized =
        true;


      /*
        Fill only the number of
        visible slots appropriate
        for the current screen.
      */

      const count =
        Math.min(
          getVisibleCount(),
          confessions.size
        );


      for(
        let i=0;
        i<count;
        i++
      ){

        const id =
          getNextConfessionId();


        if(
          id
        ){

          const item =
            createActiveWord(
              id,
              true
            );


          if(item){

            wordItems.set(
              id,
              item
            );

          }

        }

      }


      if(
        confessions.size
      ){

        empty.style.display =
          "none";

      }


      buildAdminList();


      return;

    }



    /*
      ---------------------------------
      NEW SUBMISSIONS
      ---------------------------------
    */

    incoming.forEach(
      (data,id) => {

        if(
          !confessions.has(id)
        ){

          confessions.set(
            id,
            data
          );


          /*
            Add the new submission
            to the current cycle.
          */

          if(
            !cycleQueue.includes(id)
          ){

            cycleQueue.push(
              id
            );

          }

        }else{

          confessions.set(
            id,
            data
          );

        }

      }
    );



    /*
      ---------------------------------
      DELETED SUBMISSIONS
      ---------------------------------
    */

    const deletedIds =
      Array.from(
        confessions.keys()
      ).filter(
        id =>
          !incoming.has(id)
      );


    deletedIds.forEach(
      id => {

        confessions.delete(
          id
        );


        cycleQueue =
          cycleQueue.filter(
            queueId =>
              queueId !== id
          );


        const active =
          wordItems.get(
            id
          );


        if(
          active
        ){

          wordItems.delete(
            id
          );


          const index =
            activeItems.indexOf(
              active
            );


          if(
            index !== -1
          ){

            /*
              Remove the deleted
              confession from the
              active array.

              Then immediately
              replace it with another.
            */

            activeItems.splice(
              index,
              1
            );

          }


          active.el.remove();


          if(
            confessions.size
          ){

            const replacementId =
              getNextConfessionId();


            if(
              replacementId
            ){

              const replacement =
                createActiveWord(
                  replacementId,
                  false
                );


              if(
                replacement
              ){

                wordItems.set(
                  replacementId,
                  replacement
                );

              }

            }

          }

        }


        if(
          selectedId === id
        ){

          selectedId =
            null;


          deleteButton.style.display =
            "none";

        }

      }
    );


    /*
      Update empty state.
    */

    if(
      confessions.size === 0
    ){

      empty.style.display =
        "flex";

    }else{

      empty.style.display =
        "none";

    }


    /*
      Keep the number of active
      words appropriate for the
      current screen.
    */

    const desired =
      Math.min(
        getVisibleCount(),
        confessions.size
      );


    while(
      activeItems.length <
      desired
    ){

      const id =
        getNextConfessionId();


      if(
        !id
      ){

        break;

      }


      const item =
        createActiveWord(
          id,
          false
        );


      if(
        item
      ){

        wordItems.set(
          id,
          item
        );

      }

    }


    buildAdminList();

  }
);



/* =========================================================
   SELECT CONFESSION
   ========================================================= */

function selectConfession(
  id
){

  selectedId =
    id;


  activeItems.forEach(
    item => {

      item.el.classList.remove(
        "selected"
      );

    }
  );


  const item =
    wordItems.get(
      id
    );


  if(
    item
  ){

    item.el.classList.add(
      "selected"
    );

  }


  document
    .querySelectorAll(
      ".modItem"
    )
    .forEach(
      row => {

        row.classList.toggle(
          "selected",
          row.dataset.id ===
          id
        );

      }
    );


  deleteButton.style.display =
    "block";

}



/* =========================================================
   ADMIN LIST
   ========================================================= */

function buildAdminList(){

  adminList.innerHTML =
    "";


  confessions.forEach(
    (data,id) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "modItem";


      row.dataset.id =
        id;


      row.textContent =
        data.text;


      row.addEventListener(
        "click",
        () => {

          selectConfession(
            id
          );

        }
      );


      if(
        id === selectedId
      ){

        row.classList.add(
          "selected"
        );

      }


      adminList.appendChild(
        row
      );

    }
  );

}



/* =========================================================
   MODERATION PANEL
   ========================================================= */

moderate.addEventListener(
  "click",
  () => {

    moderationPanel.classList.toggle(
      "open"
    );


    if(
      moderationPanel.classList.contains(
        "open"
      )
    ){

      adminPin.focus();


      if(
        adminUnlocked
      ){

        buildAdminList();

      }

    }

  }
);



/* =========================================================
   ADMIN LOGIN
   ========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    if(
      adminPin.value ===
      ADMIN_PIN
    ){

      adminUnlocked =
        true;


      adminPin.value =
        "";


      adminList.style.display =
        "block";


      moderationStatus.textContent =
        "Moderation unlocked. Select a confession to delete it.";


      buildAdminList();


      activeItems.forEach(
        item => {

          item.el.classList.add(
            "moderatable"
          );

        }
      );


    }else{

      adminUnlocked =
        false;


      moderationStatus.textContent =
        "Incorrect PIN.";

    }

  }
);



/* =========================================================
   DELETE
   ========================================================= */

deleteButton.addEventListener(
  "click",
  async () => {

    if(
      !adminUnlocked
    ){

      moderationStatus.textContent =
        "Moderation is locked.";

      return;

    }


    if(
      !selectedId
    ){

      moderationStatus.textContent =
        "Select a confession first.";

      return;

    }


    const idToDelete =
      selectedId;


    if(
      !confessions.has(
        idToDelete
      )
    ){

      moderationStatus.textContent =
        "That confession could not be found.";

      return;

    }


    if(
      !window.confirm(
        "Delete this confession from the shared space?"
      )
    ){

      return;

    }


    try{

      await remove(
        ref(
          database,
          "confessions/" +
          idToDelete
        )
      );


      selectedId =
        null;


      deleteButton.style.display =
        "none";


      moderationStatus.textContent =
        "Confession deleted.";

    }catch(error){

      console.error(
        "Delete error:",
        error
      );


      moderationStatus.textContent =
        "Delete failed. Check Firebase Rules.";

    }

  }
);



/* =========================================================
   CONTINUOUS ANIMATION
   ========================================================= */

let lastTime =
  performance.now();


function animate(
  currentTime
){

  const delta =
    currentTime -
    lastTime;


  lastTime =
    currentTime;


  const height =
    space.clientHeight;


  activeItems.forEach(
    item => {

      /*
        ---------------------------------
        FALL
        ---------------------------------
      */

      item.y +=
        item.speed *
        delta;



      /*
        ---------------------------------
        PULSE
        ---------------------------------
      */

      const pulse =
        Math.sin(
          currentTime *
          item.pulseSpeed +
          item.pulseOffset
        );


      let opacity =
        item.opacityBase +
        pulse * 0.10;



      /*
        ---------------------------------
        FADE IN
        ---------------------------------
      */

      if(
        item.y < 180
      ){

        const fadeIn =
          Math.max(
            0,
            Math.min(
              1,
              (
                item.y +
                120
              ) /
              300
            )
          );


        opacity *=
          fadeIn;

      }



      /*
        ---------------------------------
        FADE OUT
        ---------------------------------
      */

      if(
        item.y >
        height * .80
      ){

        const fadeOut =
          1 -
          (
            (
              item.y -
              height * .80
            ) /
            (
              height * .20
            )
          );


        opacity *=
          Math.max(
            0,
            Math.min(
              1,
              fadeOut
            )
          );

      }



      /*
        ---------------------------------
        OPACITY
        ---------------------------------
      */

      opacity =
        Math.max(
          0,
          Math.min(
            .90,
            opacity
          )
        );



      /*
        ---------------------------------
        POSITION
        ---------------------------------
      */

      item.el.style.transform =
        "translate(" +
        item.x +
        "px," +
        item.y +
        "px)";


      item.el.style.opacity =
        opacity;



      /*
        =================================
        RECYCLE
        =================================

        As soon as this confession
        leaves the bottom, immediately
        replace it with the next one.
      */

      if(
        item.y >
        height + 20
      ){

        recycleItem(
          item
        );

      }

    }
  );


  requestAnimationFrame(
    animate
  );

}



/* =========================================================
   START
   ========================================================= */

requestAnimationFrame(
  animate
);


</script>
