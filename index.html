<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Take Up Space</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  overflow:hidden;
  background:#192142;
}

/* =========================================================
   ENTRY PAGE
   ========================================================= */

#entry{
  position:relative;
  z-index:20;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:30px;

  background:#f4f1ec;
  color:#171717;

  transition:
    opacity 1.2s ease,
    visibility 1.2s ease;
}

#entry.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.entry-inner{
  width:min(720px,100%);
}

h1{
  font-size:clamp(38px,7vw,76px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.055em;

  margin:0 0 22px;

  max-width:700px;
}

.intro{
  font-size:18px;
  line-height:1.45;

  max-width:580px;

  margin:0 0 28px;
}

textarea{
  width:100%;
  min-height:190px;

  resize:vertical;

  border:1px solid #171717;

  background:#fff;
  color:#171717;

  padding:18px;

  font:inherit;
  font-size:19px;
  line-height:1.35;

  outline:none;
}

textarea:focus{
  box-shadow:0 0 0 2px #171717;
}

.entry-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:16px;

  margin-top:12px;
}

button{
  border:0;

  background:#171717;
  color:#fff;

  padding:15px 25px;
  min-height:50px;

  font:inherit;

  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:default;
}

#status{
  font-size:14px;
  min-height:20px;
}


/* =========================================================
   SHARED SPACE
   ========================================================= */

#space{
  position:absolute;
  inset:0;

  overflow:hidden;

  opacity:0;
  pointer-events:none;

  background:#192142;

  transition:opacity 1.5s ease;
}

#space.visible{
  opacity:1;
  pointer-events:auto;
}


/* =========================================================
   FALLING CONFESSIONS
   ========================================================= */

.word{
  position:absolute;

  left:0;
  top:0;

  color:#3A4C98;

  font-size:clamp(18px,2vw,42px);

  line-height:1;

  font-weight:400;

  letter-spacing:-.035em;

  white-space:nowrap;

  opacity:0;

  pointer-events:none;

  will-change:transform,opacity;

  transform-origin:center center;
}


/*
  Each confession gently fades into the space.
*/
.word.entering{
  animation:enterWord 4s ease forwards;
}

@keyframes enterWord{

  0%{
    opacity:0;
  }

  100%{
    opacity:.75;
  }

}


/*
  Moderation selection
*/
.word.moderatable{
  cursor:pointer;
  pointer-events:auto;
}

.word.selected{
  outline:1px solid #3A4C98;
  outline-offset:7px;
}


/* =========================================================
   EMPTY STATE
   ========================================================= */

#empty{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#3A4C98;

  font-size:15px;

  opacity:.6;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

#back{
  position:absolute;

  z-index:30;

  top:20px;
  left:20px;

  border:1px solid rgba(58,76,152,.45);

  background:rgba(25,33,66,.75);

  color:#3A4C98;

  padding:9px 13px;

  font-size:13px;

  opacity:.6;
}

#back:hover{
  opacity:1;
}


/* =========================================================
   ENTER SHARED SPACE
   ========================================================= */

#enterSpace{
  margin-top:14px;

  background:transparent;

  border:1px solid #171717;

  color:#171717;

  padding:12px 18px;

  font-size:14px;
}

#enterSpace:hover{
  background:#171717;
  color:#fff;
}


/* =========================================================
   MODERATION
   ========================================================= */

#moderate{
  position:absolute;

  z-index:50;

  right:20px;
  top:20px;

  border:1px solid rgba(58,76,152,.45);

  background:rgba(25,33,66,.75);

  color:#3A4C98;

  padding:10px 14px;

  font-size:13px;
}

#moderationPanel{
  position:absolute;

  z-index:60;

  right:20px;
  top:65px;

  width:min(360px,calc(100% - 40px));

  max-height:70vh;

  overflow:auto;

  background:#192142;

  border:1px solid #3A4C98;

  padding:16px;

  display:none;

  color:#3A4C98;
}

#moderationPanel.open{
  display:block;
}

#moderationPanel h2{
  font-size:16px;
  font-weight:400;

  margin:0 0 12px;
}

#adminLogin{
  display:flex;
  gap:8px;
}

#adminPin{
  flex:1;

  min-width:0;

  background:#192142;

  color:#3A4C98;

  border:1px solid #3A4C98;

  padding:10px;

  font:inherit;
}

#adminPin::placeholder{
  color:#3A4C98;
  opacity:.6;
}

#loginButton,
#deleteButton{
  padding:10px 14px;
  min-height:42px;

  background:#3A4C98;
  color:#192142;
}

#deleteButton{
  display:none;

  width:100%;

  margin-top:12px;
}

#moderationStatus{
  color:#3A4C98;

  font-size:12px;
  line-height:1.35;

  margin-top:10px;

  opacity:.75;
}

#adminList{
  display:none;

  margin-top:12px;
}

.modItem{
  border-top:1px solid rgba(58,76,152,.35);

  padding:10px 6px;

  font-size:13px;
  line-height:1.3;

  cursor:pointer;

  color:#3A4C98;
}

.modItem:hover{
  background:rgba(58,76,152,.1);
}

.modItem.selected{
  background:rgba(58,76,152,.2);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  #entry{
    padding:22px;
  }

  .entry-bottom{
    align-items:flex-end;
  }

  button{
    width:100%;
  }

  #back{
    width:auto;
  }

  #moderate{
    width:auto;
  }

  .word{
    font-size:clamp(15px,4vw,28px);
  }

}
</style>
</head>


<body>


<!-- =======================================================
     ENTRY PAGE
     ======================================================= -->

<section id="entry">

  <div class="entry-inner">

    <h1>
      What have you been taught to make yourself smaller about?
    </h1>

    <p class="intro">
      Write a confession. Once you release it, your words will enter
      the shared space with everyone else's.
    </p>


    <form id="form">

      <textarea
        id="input"
        maxlength="500"
        required
        placeholder="Write something..."
      ></textarea>


      <div class="entry-bottom">

        <span
          id="status"
          aria-live="polite"
        ></span>

        <button
          id="release"
          type="submit"
        >
          Release
        </button>

      </div>

    </form>


    <button
      id="enterSpace"
      type="button"
    >
      Enter the shared space
    </button>

  </div>

</section>



<!-- =======================================================
     SHARED SPACE
     ======================================================= -->

<section
  id="space"
  aria-label="Shared confession space"
>

  <div id="empty">
    The space is waiting.
  </div>


  <button
    id="back"
    type="button"
  >
    Add another confession
  </button>


  <button
    id="moderate"
    type="button"
  >
    Moderate
  </button>


  <!-- =====================================================
       MODERATION PANEL
       ===================================================== -->

  <aside
    id="moderationPanel"
    aria-label="Moderation panel"
  >

    <h2>
      Moderation
    </h2>


    <div id="adminLogin">

      <input
        id="adminPin"
        type="password"
        placeholder="Admin PIN"
        autocomplete="off"
      >

      <button
        id="loginButton"
        type="button"
      >
        Enter
      </button>

    </div>


    <div id="moderationStatus">
      Enter the admin PIN to manage submissions.
    </div>


    <div id="adminList"></div>


    <button
      id="deleteButton"
      type="button"
    >
      Delete selected confession
    </button>

  </aside>

</section>



<!-- =======================================================
     FIREBASE
     ======================================================= -->

<script type="module">


/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBnzqy7qtsuGJEcKkXlW2CIy76ZwZu3uQ4",

  authDomain:
    "confession-installation.firebaseapp.com",

  databaseURL:
    "https://confession-installation-default-rtdb.firebaseio.com",

  projectId:
    "confession-installation",

  storageBucket:
    "confession-installation.firebasestorage.app",

  messagingSenderId:
    "715428481943",

  appId:
    "1:715428481943:web:49e9e0d3d3aaad7ef2d2d2",

  measurementId:
    "G-325RR1JKNW"

};


import {
  initializeApp
}
from
  "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  onChildRemoved,
  remove
}
from
  "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


const app =
  initializeApp(firebaseConfig);


const database =
  getDatabase(app);


const confessionRef =
  ref(database,"confessions");



/* =========================================================
   ELEMENTS
   ========================================================= */

const entry =
  document.getElementById("entry");

const space =
  document.getElementById("space");

const form =
  document.getElementById("form");

const input =
  document.getElementById("input");

const release =
  document.getElementById("release");

const status =
  document.getElementById("status");

const enterSpace =
  document.getElementById("enterSpace");

const back =
  document.getElementById("back");

const empty =
  document.getElementById("empty");

const moderate =
  document.getElementById("moderate");

const moderationPanel =
  document.getElementById("moderationPanel");

const adminPin =
  document.getElementById("adminPin");

const loginButton =
  document.getElementById("loginButton");

const moderationStatus =
  document.getElementById("moderationStatus");

const adminList =
  document.getElementById("adminList");

const deleteButton =
  document.getElementById("deleteButton");



/* =========================================================
   MODERATION
   ========================================================= */


/*
  Prototype PIN.

  This is NOT secure because it exists in the browser code.
  For an actual exhibition, Firebase Authentication should
  be used.
*/

const ADMIN_PIN = "0092";


let adminUnlocked = false;

let selectedId = null;



/* =========================================================
   FALLING WORD SETTINGS
   ========================================================= */

const MAX_WORDS = 150;


/*
  More columns = denser field of text.

  Each confession gets its own column.
*/

const COLUMN_COUNT = 18;


/*
  Very slow movement.
*/

const FALL_SPEED_MIN = 0.055;
const FALL_SPEED_MAX = 0.12;


/*
  Minimum vertical distance between confessions
  in the same column.
*/

const WORD_GAP = 110;



/* =========================================================
   DATA
   ========================================================= */

const words = [];

const wordItems = new Map();



/* =========================================================
   RANDOM HELPER
   ========================================================= */

function random(min,max){

  return Math.random() * (max-min) + min;

}



/* =========================================================
   GET A COLUMN
   ========================================================= */

function getBestColumn(){

  const counts =
    new Array(COLUMN_COUNT).fill(0);


  words.forEach(item => {

    counts[item.column]++;

  });


  let best =
    0;


  for(
    let i=1;
    i<COLUMN_COUNT;
    i++
  ){

    if(
      counts[i] <
      counts[best]
    ){

      best = i;

    }

  }


  return best;

}



/* =========================================================
   TEXT SIZE
   ========================================================= */

function getFontSize(text){

  const length =
    text.length;


  if(length > 400){

    return random(15,18);

  }


  if(length > 300){

    return random(17,21);

  }


  if(length > 200){

    return random(19,24);

  }


  if(length > 120){

    return random(22,28);

  }


  return random(25,42);

}



/* =========================================================
   ADD WORD
   ========================================================= */

function addWord(
  id,
  text,
  isNewSubmission=false
){

  if(!text) return;


  empty.style.display =
    "none";


  const el =
    document.createElement("div");


  el.className =
    "word entering";


  el.textContent =
    text;


  el.dataset.id =
    id;


  /*
    Different sizes make the projection
    feel more organic.
  */

  el.style.fontSize =
    getFontSize(text) + "px";


  space.appendChild(el);



  /*
    Choose a column.
  */

  const column =
    getBestColumn();


  const width =
    space.clientWidth;


  const height =
    space.clientHeight;


  const columnWidth =
    width / COLUMN_COUNT;


  /*
    Random horizontal position inside
    the column.
  */

  let x =
    column * columnWidth +
    random(
      10,
      Math.max(
        11,
        columnWidth - 20
      )
    );


  /*
    Measure the text.
  */

  const naturalWidth =
    el.offsetWidth;


  /*
    Keep very long confessions
    from becoming absurdly wide.

    Instead of cutting the text,
    we scale the whole confession.
  */

  const maximumWidth =
    Math.max(
      120,
      columnWidth * 3.2
    );


  let scale = 1;


  if(
    naturalWidth >
    maximumWidth
  ){

    scale =
      maximumWidth /
      naturalWidth;

  }


  /*
    Initial vertical position.

    New confessions enter above
    the projection.
  */

  let y =
    -el.offsetHeight -
    random(40,250);


  /*
    Find the lowest existing word
    in this column.

    This prevents words from being
    stacked directly on top of one another.
  */

  const itemsInColumn =
    words.filter(
      item =>
        item.column === column
    );


  if(itemsInColumn.length){

    let highestStart =
      -Infinity;


    itemsInColumn.forEach(item => {

      const bottom =
        item.y +
        item.el.offsetHeight *
        item.scale;


      if(bottom > highestStart){

        highestStart =
          bottom;

      }

    });


    /*
      If another word is already
      entering the same column,
      put this one farther above it.
    */

    y =
      Math.min(
        y,
        highestStart -
        WORD_GAP -
        el.offsetHeight
      );

  }



  /*
    Slightly different speeds,
    but all remain very slow.
  */

  const speed =
    random(
      FALL_SPEED_MIN,
      FALL_SPEED_MAX
    );


  const item = {

    id,

    el,

    column,

    x,

    y,

    speed,

    scale,

    pulseOffset:
      random(0,Math.PI*2),

    pulseSpeed:
      random(.0005,.0012),

    opacityBase:
      random(.48,.78),

    entered:
      false

  };


  words.push(item);

  wordItems.set(
    id,
    item
  );


  /*
    Allow moderation to select
    a confession directly.
  */

  el.addEventListener(
    "click",
    () => {

      if(!adminUnlocked)
        return;

      selectConfession(id);

    }
  );


  /*
    Keep only the newest 150
    in the browser.
  */

  if(
    words.length >
    MAX_WORDS
  ){

    const old =
      words.shift();


    wordItems.delete(
      old.id
    );


    old.el.remove();

  }


  /*
    New submissions can briefly
    appear slightly stronger.
  */

  if(isNewSubmission){

    item.opacityBase =
      .9;

  }


  return item;

}



/* =========================================================
   SHOW SHARED SPACE
   ========================================================= */

function showSpace(){

  entry.classList.add(
    "hidden"
  );

  space.classList.add(
    "visible"
  );

}



/* =========================================================
   SHOW ENTRY
   ========================================================= */

function showEntry(){

  space.classList.remove(
    "visible"
  );

  entry.classList.remove(
    "hidden"
  );

  input.focus();

}



/* =========================================================
   ENTER SHARED SPACE
   ========================================================= */

enterSpace.addEventListener(
  "click",
  () => {

    showSpace();

  }
);



/* =========================================================
   SUBMIT CONFESSION
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const text =
      input.value
        .trim()
        .replace(/\s+/g," ");


    if(!text)
      return;


    release.disabled =
      true;


    status.textContent =
      "Releasing…";


    try{

      await push(
        confessionRef,
        {

          text,

          createdAt:
            Date.now()

        }
      );


      input.value =
        "";


      status.textContent =
        "";


      showSpace();


    }catch(error){

      console.error(
        "Submission error:",
        error
      );


      status.textContent =
        "Something went wrong. Try again.";


      release.disabled =
        false;

    }

  }
);



/* =========================================================
   BACK TO ENTRY
   ========================================================= */

back.addEventListener(
  "click",
  () => {

    showEntry();

    release.disabled =
      false;

    status.textContent =
      "";

  }
);



/* =========================================================
   FIREBASE: NEW CONFESSION
   ========================================================= */

onChildAdded(
  confessionRef,
  snapshot => {

    const data =
      snapshot.val();


    if(
      !data ||
      typeof data.text !== "string"
    ){

      return;

    }


    /*
      Add the confession to the
      shared projection.
    */

    addWord(
      snapshot.key,
      data.text,
      false
    );

  }
);



/* =========================================================
   FIREBASE: REMOVED CONFESSION
   ========================================================= */

onChildRemoved(
  confessionRef,
  snapshot => {

    const id =
      snapshot.key;


    const item =
      wordItems.get(id);


    if(!item)
      return;


    item.el.remove();


    wordItems.delete(id);


    const index =
      words.indexOf(item);


    if(index !== -1){

      words.splice(
        index,
        1
      );

    }


    if(words.length === 0){

      empty.style.display =
        "flex";

    }


    if(selectedId === id){

      selectedId =
        null;

      deleteButton.style.display =
        "none";

    }


    buildAdminList();

  }
);



/* =========================================================
   SELECT CONFESSION
   ========================================================= */

function selectConfession(id){

  selectedId =
    id;


  wordItems.forEach(
    item => {

      item.el.classList.remove(
        "selected"
      );

    }
  );


  const item =
    wordItems.get(id);


  if(item){

    item.el.classList.add(
      "selected"
    );

  }


  document
    .querySelectorAll(".modItem")
    .forEach(row => {

      row.classList.toggle(
        "selected",
        row.dataset.id === id
      );

    });


  deleteButton.style.display =
    "block";

}



/* =========================================================
   ADMIN LIST
   ========================================================= */

function buildAdminList(){

  adminList.innerHTML =
    "";


  wordItems.forEach(
    (item,id) => {

      const row =
        document.createElement("div");


      row.className =
        "modItem";


      row.dataset.id =
        id;


      row.textContent =
        item.el.textContent;


      row.addEventListener(
        "click",
        () => {

          selectConfession(id);

        }
      );


      adminList.appendChild(
        row
      );

    }
  );

}



/* =========================================================
   OPEN MODERATION
   ========================================================= */

moderate.addEventListener(
  "click",
  () => {

    moderationPanel.classList.toggle(
      "open"
    );


    if(
      moderationPanel.classList.contains(
        "open"
      ) &&
      adminUnlocked
    ){

      buildAdminList();

    }


    if(
      moderationPanel.classList.contains(
        "open"
      )
    ){

      adminPin.focus();

    }

  }
);



/* =========================================================
   ADMIN LOGIN
   ========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    if(
      adminPin.value ===
      ADMIN_PIN
    ){

      adminUnlocked =
        true;


      adminPin.value =
        "";


      adminList.style.display =
        "block";


      moderationStatus.textContent =
        "Moderation unlocked. Select a confession to delete it.";


      buildAdminList();


      wordItems.forEach(
        item => {

          item.el.classList.add(
            "moderatable"
          );

        }
      );


    }else{

      moderationStatus.textContent =
        "Incorrect PIN.";


      adminUnlocked =
        false;

    }

  }
);



/* =========================================================
   DELETE CONFESSION
   ========================================================= */

deleteButton.addEventListener(
  "click",
  async () => {

    if(!adminUnlocked){

      moderationStatus.textContent =
        "Moderation is locked.";

      return;

    }


    if(!selectedId){

      moderationStatus.textContent =
        "Select a confession first.";

      return;

    }


    const idToDelete =
      selectedId;


    const item =
      wordItems.get(
        idToDelete
      );


    if(!item){

      moderationStatus.textContent =
        "That confession could not be found.";

      return;

    }


    if(
      !window.confirm(
        "Delete this confession from the shared space?"
      )
    ){

      return;

    }


    try{

      await remove(
        ref(
          database,
          "confessions/" +
          idToDelete
        )
      );


      /*
        onChildRemoved will clean
        up the visual element.
      */

      selectedId =
        null;


      deleteButton.style.display =
        "none";


      moderationStatus.textContent =
        "Confession deleted.";


    }catch(error){

      console.error(
        "Delete error:",
        error
      );


      moderationStatus.textContent =
        "Delete failed. Check Firebase Rules.";

    }

  }
);



/* =========================================================
   ANIMATION
   ========================================================= */

let lastTime =
  performance.now();


function animate(
  currentTime
){

  const delta =
    currentTime -
    lastTime;


  lastTime =
    currentTime;


  const height =
    space.clientHeight;


  words.forEach(
    item => {

      /*
        Move downward.
      */

      item.y +=
        item.speed *
        delta;


      /*
        Remove/recycle the word
        when it leaves the bottom.

        Instead of disappearing instantly,
        it gets a fading opacity.
      */

      const progress =
        item.y /
        height;


      /*
        Gentle breathing pulse.

        Each word has its own phase,
        so they don't pulse together.
      */

      const pulse =
        Math.sin(
          currentTime *
          item.pulseSpeed +
          item.pulseOffset
        );


      /*
        Convert pulse into a subtle
        opacity variation.
      */

      let opacity =
        item.opacityBase +
        pulse * .12;


      /*
        Fade in near the top.
      */

      if(progress < .12){

        const fadeIn =
          progress / .12;


        opacity *=
          Math.max(
            0,
            Math.min(
              1,
              fadeIn
            )
          );

      }


      /*
        Fade out near the bottom.
      */

      if(progress > .82){

        const fadeOut =
          1 -
          (
            (progress-.82) /
            .18
          );


        opacity *=
          Math.max(
            0,
            Math.min(
              1,
              fadeOut
            )
          );

      }


      /*
        Keep opacity within bounds.
      */

      opacity =
        Math.max(
          0,
          Math.min(
            .95,
            opacity
          )
        );


      /*
        Position and scale.

        The scale lets long confessions
        remain readable without wrapping.
      */

      item.el.style.transform =
        `translate(${item.x}px, ${item.y}px) scale(${item.scale})`;


      item.el.style.opacity =
        opacity;


      /*
        Once it is fully below the screen,
        remove it from the visual field.
      */

      if(
        item.y >
        height + 100
      ){

        item.el.remove();


        wordItems.delete(
          item.id
        );


        const index =
          words.indexOf(item);


        if(index !== -1){

          words.splice(
            index,
            1
          );

        }

      }

    }
  );


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);


</script>
