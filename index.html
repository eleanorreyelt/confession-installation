/* =========================================================

   ========================================================= */

function startVideo(){

    );

startVideo();



/* =========================================================
   MODERATION
   ========================================================= */

const ADMIN_PIN =
  "0092";


let adminUnlocked =
  false;


let selectedId =
  null;



/* =========================================================
   FALLING SETTINGS
   ========================================================= */

/*
  Maximum number of confession
  objects in the projection.
*/

const MAX_WORDS =
  150;


/*
  ONE shared speed.

  This is important.

  Because every word moves at
  the same speed, one confession
  cannot catch up to another.
*/

const FALL_SPEED =
  0.018;


/*
  Minimum distance between
  confession boxes.
*/

const WORD_GAP =
  70;


/*
  How many attempts we make
  to find a truly open area.
*/

const PLACEMENT_ATTEMPTS =
  250;


/*
  Initial field density.

  This determines how many
  confessions are visibly spread
  across the screen when the
  shared space opens.
*/

const INITIAL_FILL =
  0.62;



/* =========================================================
   STORAGE
   ========================================================= */

const words =
  [];


const wordItems =
  new Map();



/* =========================================================
   RANDOM
   ========================================================= */

function random(
  min,
  max
){

  return (
    Math.random() *
    (max - min)
  ) + min;

}



/* =========================================================
   FONT SIZE
   ========================================================= */

function getFontSize(
  text
){

  const length =
    text.length;


  /*
    Longer confessions stay
    readable.
  */

  if(
    length > 400
  ){

    return random(
      21,
      24
    );

  }


  if(
    length > 300
  ){

    return random(
      23,
      27
    );

  }


  if(
    length > 200
  ){

    return random(
      25,
      30
    );

  }


  if(
    length > 120
  ){

    return random(
      28,
      33
    );

  }


  return random(
    31,
    40
  );

}



/* =========================================================
   RECTANGLE
   ========================================================= */

function getRect(
  x,
  y,
  width,
  height
){

  return {

    left:
      x,

    top:
      y,

    right:
      x + width,

    bottom:
      y + height

  };

}



/* =========================================================
   RECTANGLE COLLISION
   ========================================================= */

function rectanglesOverlap(
  a,
  b,
  gap
){

  return !(
    a.right + gap <= b.left ||
    a.left >= b.right + gap ||
    a.bottom + gap <= b.top ||
    a.top >= b.bottom + gap
  );

}



/* =========================================================
   CHECK WHETHER POSITION IS OPEN
   ========================================================= */

function positionIsOpen(
  x,
  y,
  width,
  height,
  ignoreItem=null
){

  const candidate =
    getRect(
      x,
      y,
      width,
      height
    );


  for(
    const item of words
  ){

    if(
      item === ignoreItem
    ){

      continue;

    }


    const itemRect =
      getRect(
        item.x,
        item.y,
        item.el.offsetWidth,
        item.el.offsetHeight
      );


    if(
      rectanglesOverlap(
        candidate,
        itemRect,
        WORD_GAP
      )
    ){

      return false;

    }

  }


  return true;

}



/* =========================================================
   FIND OPEN POSITION
   ========================================================= */

function findOpenPosition(
  width,
  height,
  initial=false
){

  const spaceWidth =
    space.clientWidth;


  const spaceHeight =
    space.clientHeight;


  /*
    For new/recycled words,
    search across the entire
    horizontal width while keeping
    them immediately above the top.
  */

  if(
    !initial
  ){

    const topY =
      -height -
      random(
        15,
        50
      );


    /*
      Try lots of horizontal
      positions above the screen.

      Since the word is above the
      viewport, we only need to
      make sure its future path
      has enough separation.
    */

    for(
      let attempt=0;
      attempt<PLACEMENT_ATTEMPTS;
      attempt++
    ){

      const x =
        random(
          0,
          Math.max(
            1,
            spaceWidth -
            width
          )
        );


      /*
        Check a little distance
        down the path, too.
      */

      const candidate =
        getRect(
          x,
          topY,
          width,
          height
        );


      let blocked =
        false;


      for(
        const item of words
      ){

        const itemRect =
          getRect(
            item.x,
            item.y,
            item.el.offsetWidth,
            item.el.offsetHeight
          );


        /*
          Only worry about items
          close enough vertically
          that the paths could meet.
        */

        if(
          itemRect.bottom <
          candidate.top - WORD_GAP
        ){

          continue;

        }


        if(
          itemRect.top >
          candidate.bottom + WORD_GAP
        ){

          continue;

        }


        if(
          rectanglesOverlap(
            candidate,
            itemRect,
            WORD_GAP
          )
        ){

          blocked =
            true;

          break;

        }

      }


      if(
        !blocked
      ){

        return {
          x,
          y:topY
        };

      }

    }


    /*
      If every horizontal position
      is occupied, put it at a random
      point above the frame.

      Because everything moves at
      the same speed, it will still
      keep its relative position.
    */

    return {

      x:
        random(
          0,
          Math.max(
            1,
            spaceWidth -
            width
          )
        ),

      y:
        topY -
        random(
          20,
          80
        )

    };

  }



  /*
    ---------------------------------
    INITIAL SCREEN FILL
    ---------------------------------

    Search for random open areas.
  */

  for(
    let attempt=0;
    attempt<PLACEMENT_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        0,
        Math.max(
          1,
          spaceWidth -
          width
        )
      );


    const y =
      random(
        20,
        Math.max(
          21,
          spaceHeight -
          height -
          20
        )
      );


    if(
      positionIsOpen(
        x,
        y,
        width,
        height
      )
    ){

      return {
        x,
        y
      };

    }

  }


  /*
    If there truly isn't enough
    empty room, return a random
    position rather than causing
    the code to fail.
  */

  return {

    x:
      random(
        0,
        Math.max(
          1,
          spaceWidth -
          width
        )
      ),

    y:
      random(
        20,
        Math.max(
          21,
          spaceHeight -
          height -
          20
        )
      )

  };

}



/* =========================================================
   ADD WORD
   ========================================================= */

function addWord(
  id,
  text,
  initial=false
){

  if(
    !text
  ){

    return;

  }


  empty.style.display =
    "none";


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "word";


  el.textContent =
    text;


  el.dataset.id =
    id;


  /*
    Set the readable font size.
  */

  el.style.fontSize =
    getFontSize(text) +
    "px";


  space.appendChild(
    el
  );


  /*
    Force layout so we can
    measure the real dimensions.
  */

  const wordWidth =
    el.offsetWidth;


  const wordHeight =
    el.offsetHeight;


  /*
    Find an open area.
  */

  const position =
    findOpenPosition(
      wordWidth,
      wordHeight,
      initial
    );


  const item = {

    id,

    el,

    x:
      position.x,

    y:
      position.y,

    /*
      EVERY WORD HAS EXACTLY
      THE SAME SPEED.

      This prevents catch-up
      and collisions caused by
      different speeds.
    */

    speed:
      FALL_SPEED,


    /*
      Individual pulse.
    */

    pulseOffset:
      random(
        0,
        Math.PI * 2
      ),


    pulseSpeed:
      random(
        0.0005,
        0.0010
      ),


    opacityBase:
      random(
        0.48,
        0.72
      )

  };


  words.push(
    item
  );


  wordItems.set(
    id,
    item
  );


  /*
    New confessions get slightly
    stronger visibility.
  */

  if(
    !initial
  ){

    item.opacityBase =
      0.82;

  }


  /*
    Moderation selection.
  */

  el.addEventListener(
    "click",
    () => {

      if(
        !adminUnlocked
      ){

        return;

      }


      selectConfession(
        id
      );

    }
  );


  /*
    Prevent too many objects.
  */

  while(
    words.length >
    MAX_WORDS
  ){

    const old =
      words.shift();


    wordItems.delete(
      old.id
    );


    old.el.remove();

  }


  return item;

}



/* =========================================================
   SHOW SPACE
   ========================================================= */

function showSpace(){

  entry.classList.add(
    "hidden"
  );


  space.classList.add(
    "visible"
  );


  startVideo();

}



/* =========================================================
   SHOW ENTRY
   ========================================================= */

function showEntry(){

  space.classList.remove(
    "visible"
  );


  entry.classList.remove(
    "hidden"
  );


  input.focus();

}



/* =========================================================
   ENTER SPACE
   ========================================================= */

enterSpace.addEventListener(
  "click",
  () => {

    showSpace();

  }
);



/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const text =
      input.value
        .trim()
        .replace(
          /\s+/g,
          " "
        );


    if(
      !text
    ){

      return;

    }


    release.disabled =
      true;


    status.textContent =
      "Releasing…";


    try{

      await push(
        confessionRef,
        {

          text,

          createdAt:
            Date.now()

        }
      );


      input.value =
        "";


      status.textContent =
        "";


      showSpace();


    }catch(error){

      console.error(
        "Submission error:",
        error
      );


      status.textContent =
        "Something went wrong. Try again.";


      release.disabled =
        false;

    }

  }
);



/* =========================================================
   BACK
   ========================================================= */

back.addEventListener(
  "click",
  () => {

    showEntry();


    release.disabled =
      false;


    status.textContent =
      "";

  }
);



/* =========================================================
   FIREBASE: ADD
   ========================================================= */

onChildAdded(
  confessionRef,
  snapshot => {

    const data =
      snapshot.val();


    if(
      !data ||
      typeof data.text !==
      "string"
    ){

      return;

    }


    /*
      Existing database confessions
      fill the projection.

      New submissions enter from
      above.
    */

    const initial =
      !space.classList.contains(
        "visible"
      );


    addWord(
      snapshot.key,
      data.text,
      initial
    );

  }
);



/* =========================================================
   FIREBASE: REMOVE
   ========================================================= */

onChildRemoved(
  confessionRef,
  snapshot => {

    const id =
      snapshot.key;


    const item =
      wordItems.get(
        id
      );


    if(
      !item
    ){

      return;

    }


    item.el.remove();


    wordItems.delete(
      id
    );


    const index =
      words.indexOf(
        item
      );


    if(
      index !== -1
    ){

      words.splice(
        index,
        1
      );

    }


    if(
      selectedId === id
    ){

      selectedId =
        null;


      deleteButton.style.display =
        "none";

    }


    buildAdminList();

  }
);



/* =========================================================
   SELECT
   ========================================================= */

function selectConfession(
  id
){

  selectedId =
    id;


  wordItems.forEach(
    item => {

      item.el.classList.remove(
        "selected"
      );

    }
  );


  const item =
    wordItems.get(
      id
    );


  if(
    item
  ){

    item.el.classList.add(
      "selected"
    );

  }


  document
    .querySelectorAll(
      ".modItem"
    )
    .forEach(
      row => {

        row.classList.toggle(
          "selected",
          row.dataset.id === id
        );

      }
    );


  deleteButton.style.display =
    "block";

}



/* =========================================================
   ADMIN LIST
   ========================================================= */

function buildAdminList(){

  adminList.innerHTML =
    "";


  wordItems.forEach(
    (item,id) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "modItem";


      row.dataset.id =
        id;


      row.textContent =
        item.el.textContent;


      row.addEventListener(
        "click",
        () => {

          selectConfession(
            id
          );

        }
      );


      adminList.appendChild(
        row
      );

    }
  );

}



/* =========================================================
   MODERATION PANEL
   ========================================================= */

moderate.addEventListener(
  "click",
  () => {

    moderationPanel.classList.toggle(
      "open"
    );


    if(
      moderationPanel.classList.contains(
        "open"
      )
    ){

      adminPin.focus();


      if(
        adminUnlocked
      ){

        buildAdminList();

      }

    }

  }
);



/* =========================================================
   LOGIN
   ========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    if(
      adminPin.value ===
      ADMIN_PIN
    ){

      adminUnlocked =
        true;


      adminPin.value =
        "";


      adminList.style.display =
        "block";


      moderationStatus.textContent =
        "Moderation unlocked. Select a confession to delete it.";


      buildAdminList();


      wordItems.forEach(
        item => {

          item.el.classList.add(
            "moderatable"
          );

        }
      );


    }else{

      adminUnlocked =
        false;


      moderationStatus.textContent =
        "Incorrect PIN.";

    }

  }
);



/* =========================================================
   DELETE
   ========================================================= */

deleteButton.addEventListener(
  "click",
  async () => {

    if(
      !adminUnlocked
    ){

      moderationStatus.textContent =
        "Moderation is locked.";

      return;

    }


    if(
      !selectedId
    ){

      moderationStatus.textContent =
        "Select a confession first.";

      return;

    }


    const idToDelete =
      selectedId;


    const item =
      wordItems.get(
        idToDelete
      );


    if(
      !item
    ){

      moderationStatus.textContent =
        "That confession could not be found.";

      return;

    }


    if(
      !window.confirm(
        "Delete this confession from the shared space?"
      )
    ){

      return;

    }


    try{

      await remove(
        ref(
          database,
          "confessions/" +
          idToDelete
        )
      );


      selectedId =
        null;


      deleteButton.style.display =
        "none";


      moderationStatus.textContent =
        "Confession deleted.";


    }catch(error){

      console.error(
        "Delete error:",
        error
      );


      moderationStatus.textContent =
        "Delete failed. Check Firebase Rules.";

    }

  }
);



/* =========================================================
   CONTINUOUS ANIMATION
   ========================================================= */

let lastTime =
  performance.now();


function animate(
  currentTime
){

  const delta =
    currentTime -
    lastTime;


  lastTime =
    currentTime;


  const width =
    space.clientWidth;


  const height =
    space.clientHeight;


  words.forEach(
    item => {


      /*
        =================================
        FALL
        =================================
      */

      item.y +=
        item.speed *
        delta;



      /*
        =================================
        PULSE
        =================================
      */

      const pulse =
        Math.sin(
          currentTime *
          item.pulseSpeed +
          item.pulseOffset
        );


      let opacity =
        item.opacityBase +
        pulse * 0.10;



      /*
        =================================
        FADE IN
        =================================
      */

      if(
        item.y <
        180
      ){

        const fadeIn =
          Math.max(
            0,
            Math.min(
              1,
              (
                item.y +
                120
              ) /
              300
            )
          );


        opacity *=
          fadeIn;

      }



      /*
        =================================
        FADE OUT
        =================================
      */

      if(
        item.y >
        height * .80
      ){

        const fadeOut =
          1 -
          (
            (
              item.y -
              height * .80
            ) /
            (
              height * .20
            )
          );


        opacity *=
          Math.max(
            0,
            Math.min(
              1,
              fadeOut
            )
          );

      }



      /*
        =================================
        OPACITY
        =================================
      */

      opacity =
        Math.max(
          0,
          Math.min(
            .90,
            opacity
          )
        );



      /*
        =================================
        POSITION
        =================================
      */

      item.el.style.transform =
        "translate(" +
        item.x +
        "px," +
        item.y +
        "px)";


      item.el.style.opacity =
        opacity;



      /*
        =================================
        CONTINUOUS RECYCLING
        =================================

        The word is NEVER deleted
        because of reaching the bottom.

        It immediately returns above
        the screen.
      */

      if(
        item.y >
        height + 20
      ){

        /*
          Measure again in case the
          browser changed the text
          dimensions.
        */

        const wordWidth =
          item.el.offsetWidth;


        const wordHeight =
          item.el.offsetHeight;


        /*
          Find a new open position
          above the frame.
        */

        const position =
          findOpenPosition(
            wordWidth,
            wordHeight,
            false
          );


        item.x =
          position.x;


        item.y =
          position.y;



        /*
          Reset pulse.
        */

        item.pulseOffset =
          random(
            0,
            Math.PI * 2
          );


        item.pulseSpeed =
          random(
            0.0005,
            0.0010
          );


        /*
          Reset opacity.

          The fade-in section will
          bring it back as it enters.
        */

        item.el.style.opacity =
          0;

      }

    }
  );


  requestAnimationFrame(
    animate
  );

}



/* =========================================================
   START
   ========================================================= */

requestAnimationFrame(
  animate
);


</script>

</body>

</html>
