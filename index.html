<style>

/* =========================================================
   BASIC
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  overflow:hidden;
  background:#192142;
}



/* =========================================================
   ENTRY PAGE
   ========================================================= */

#entry{
  position:relative;
  z-index:20;

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:30px;

  background:#192142;
  color:#677AC5;

  transition:
    opacity 1.2s ease,
    visibility 1.2s ease;
}

#entry.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.entry-inner{
  width:min(720px,100%);
}

h1{
  font-size:clamp(38px,7vw,76px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.055em;

  margin:0 0 22px;

  max-width:700px;
}

.intro{
  font-size:18px;
  line-height:1.45;

  max-width:580px;

  margin:0 0 28px;
}

textarea{
  width:100%;
  min-height:190px;

  resize:vertical;

  border:1px solid #677AC5;

  background:#192142;
  color:#677AC5;

  padding:18px;

  font:inherit;
  font-size:19px;
  line-height:1.35;

  outline:none;
}

textarea::placeholder{
  color:#677AC5;
  opacity:.55;
}

textarea:focus{
  box-shadow:0 0 0 2px #677AC5;
}

.entry-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:16px;

  margin-top:12px;
}

button{
  border:0;

  background:#677AC5;
  color:#192142;

  padding:15px 25px;
  min-height:50px;

  font:inherit;

  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:default;
}

#status{
  font-size:14px;
  min-height:20px;
}

#enterSpace{
  margin-top:14px;

  background:transparent;

  border:1px solid #677AC5;

  color:#677AC5;

  padding:12px 18px;

  font-size:14px;
}

#enterSpace:hover{
  background:#677AC5;
  color:#192142;
}



/* =========================================================
   SHARED SPACE
   ========================================================= */

#space{
  position:absolute;
  inset:0;

  width:100%;
  height:100dvh;

  overflow:hidden;

  background:#192142;

  opacity:0;
  pointer-events:none;

  transition:opacity 1.5s ease;
}

#space.visible{
  opacity:1;
  pointer-events:auto;
}



/* =========================================================
   VIDEO
   ========================================================= */

#backgroundVideo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:0;

  opacity:.72;

  filter:blur(1px);

  transform:scale(1.015);

  pointer-events:none;
}



/* =========================================================
   VIDEO COLOR OVERLAY
   ========================================================= */

#videoOverlay{
  position:absolute;
  inset:0;

  z-index:1;

  background:
    rgba(
      25,
      33,
      66,
      .58
    );

  pointer-events:none;
}



/* =========================================================
   CONFESSIONS
   ========================================================= */

.word{
  position:absolute;

  left:0;
  top:0;

  z-index:5;

  color:#677AC5;

  font-size:clamp(
    21px,
    2vw,
    38px
  );

  line-height:1.06;

  font-weight:400;

  letter-spacing:-.035em;

  /*
    Longer confessions wrap instead
    of becoming microscopic.
  */

  white-space:normal;

  width:max-content;

  max-width:min(
    38vw,
    620px
  );

  opacity:0;

  pointer-events:none;

  will-change:
    transform,
    opacity;

  transform-origin:center center;
}



/* =========================================================
   NAVIGATION
   ========================================================= */

#back{
  position:absolute;

  z-index:30;

  top:
    calc(
      20px +
      env(safe-area-inset-top)
    );

  left:
    calc(
      20px +
      env(safe-area-inset-left)
    );

  border:
    1px solid
    rgba(
      103,
      122,
      197,
      .45
    );

  background:
    rgba(
      25,
      33,
      66,
      .72
    );

  color:#677AC5;

  padding:9px 13px;

  font-size:13px;

  opacity:.7;
}

#back:hover{
  opacity:1;
}



/* =========================================================
   EMPTY STATE
   ========================================================= */

#empty{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#677AC5;

  font-size:15px;

  opacity:.6;
}



/* =========================================================
   MODERATION BUTTON
   ========================================================= */

#moderate{
  position:absolute;

  z-index:50;

  top:
    calc(
      20px +
      env(safe-area-inset-top)
    );

  right:
    calc(
      20px +
      env(safe-area-inset-right)
    );

  border:
    1px solid
    rgba(
      103,
      122,
      197,
      .45
    );

  background:
    rgba(
      25,
      33,
      66,
      .72
    );

  color:#677AC5;

  padding:10px 14px;

  font-size:13px;
}



/* =========================================================
   MODERATION PANEL
   ========================================================= */

#moderationPanel{

  z-index:60;

  top:
    calc(
      65px +
      env(safe-area-inset-top)
    );

  right:
    calc(
      20px +
      env(safe-area-inset-right)
    );

  width:
    min(
      360px,
      calc(
        100% -

  overflow:auto;

  border:

  padding:16px;

  color:#677AC5;

  border:

  padding:10px;

  font:inherit;
}

#adminPin::placeholder{

}

#loginButton,

#deleteButton{

#moderationStatus{

#adminList{

/* =========================================================
   VIDEO WITH SOUND
   ========================================================= */

function startVideo(){

  /*
    Sound is intentionally enabled.

    This function is only called from
    user interactions so the browser
    has a better chance of allowing
    audible playback.
  */

  backgroundVideo.muted =
    false;


  backgroundVideo.volume =
    1;


  const playPromise =
    backgroundVideo.play();


  if(
    playPromise &&
    typeof playPromise.catch ===
    "function"
  ){

    playPromise.catch(
      error => {

        console.log(
          "Video playback was blocked:",
          error
        );

      }
    );

  }

}



/* =========================================================
   MODERATION
   ========================================================= */

const ADMIN_PIN =
  "0092";


let adminUnlocked =
  false;


let selectedId =
  null;



/* =========================================================
   FALLING SYSTEM
   ========================================================= */

const MAX_WORDS =
  150;


/*
  All confessions move at exactly
  the same speed.

  That means they cannot catch
  one another.
*/

const FALL_SPEED =
  0.018;


/*
  Minimum empty space around
  each confession.
*/

const WORD_GAP =
  70;


/*
  Number of attempts used to find
  an open location.
*/

const PLACEMENT_ATTEMPTS =
  300;



/* =========================================================
   WORD STORAGE
   ========================================================= */

const words =
  [];


const wordItems =
  new Map();



/* =========================================================
   RANDOM
   ========================================================= */

function random(
  min,
  max
){

  return (
    Math.random() *
    (max - min)
  ) + min;

}



/* =========================================================
   FONT SIZE
   ========================================================= */

function getFontSize(
  text
){

  const length =
    text.length;


  /*
    Long confessions stay readable.
  */

  if(
    length > 400
  ){

    return random(
      21,
      24
    );

  }


  if(
    length > 300
  ){

    return random(
      23,
      27
    );

  }


  if(
    length > 200
  ){

    return random(
      25,
      30
    );

  }


  if(
    length > 120
  ){

    return random(
      28,
      33
    );

  }


  return random(
    31,
    40
  );

}



/* =========================================================
   RECTANGLE
   ========================================================= */

function getRect(
  x,
  y,
  width,
  height
){

  return {

    left:x,

    top:y,

    right:
      x + width,

    bottom:
      y + height

  };

}



/* =========================================================
   COLLISION CHECK
   ========================================================= */

function rectanglesOverlap(
  a,
  b,
  gap
){

  return !(
    a.right + gap <= b.left ||
    a.left >= b.right + gap ||
    a.bottom + gap <= b.top ||
    a.top >= b.bottom + gap
  );

}



/* =========================================================
   POSITION CHECK
   ========================================================= */

function positionIsOpen(
  x,
  y,
  width,
  height,
  ignoreItem=null
){

  const candidate =
    getRect(
      x,
      y,
      width,
      height
    );


  for(
    const item of words
  ){

    if(
      item === ignoreItem
    ){

      continue;

    }


    const itemRect =
      getRect(
        item.x,
        item.y,
        item.el.offsetWidth,
        item.el.offsetHeight
      );


    if(
      rectanglesOverlap(
        candidate,
        itemRect,
        WORD_GAP
      )
    ){

      return false;

    }

  }


  return true;

}



/* =========================================================
   FIND OPEN POSITION
   ========================================================= */

function findOpenPosition(
  width,
  height,
  initial=false,
  ignoreItem=null
){

  const spaceWidth =
    space.clientWidth;


  const spaceHeight =
    space.clientHeight;



  /* -------------------------------------------------------
     EXISTING CONFESSIONS
     ------------------------------------------------------- */

  if(
    initial
  ){

    for(
      let attempt=0;
      attempt<PLACEMENT_ATTEMPTS;
      attempt++
    ){

      const x =
        random(
          0,
          Math.max(
            1,
            spaceWidth -
            width
          )
        );


      const y =
        random(
          0,
          Math.max(
            1,
            spaceHeight -
            height
          )
        );


      if(
        positionIsOpen(
          x,
          y,
          width,
          height,
          ignoreItem
        )
      ){

        return {
          x,
          y
        };

      }

    }


    /*
      Fallback.
    */

    return {

      x:
        random(
          0,
          Math.max(
            1,
            spaceWidth -
            width
          )
        ),

      y:
        random(
          0,
          Math.max(
            1,
            spaceHeight -
            height
          )
        )

    };

  }



  /* -------------------------------------------------------
     NEW / RECYCLED CONFESSION
     ------------------------------------------------------- */

  /*
    New words sit immediately above
    the frame.
  */

  const topY =
    -height -
    random(
      10,
      60
    );


  for(
    let attempt=0;
    attempt<PLACEMENT_ATTEMPTS;
    attempt++
  ){

    const x =
      random(
        0,
        Math.max(
          1,
          spaceWidth -
          width
        )
      );


    const candidate =
      getRect(
        x,
        topY,
        width,
        height
      );


    let blocked =
      false;


    for(
      const item of words
    ){

      if(
        item === ignoreItem
      ){

        continue;

      }


      const itemRect =
        getRect(
          item.x,
          item.y,
          item.el.offsetWidth,
          item.el.offsetHeight
        );


      /*
        Ignore things far away
        from the top entry path.
      */

      if(
        itemRect.top >
        candidate.bottom +
        WORD_GAP +
        100
      ){

        continue;

      }


      if(
        itemRect.bottom <
        candidate.top -
        WORD_GAP -
        100
      ){

        continue;

      }


      if(
        rectanglesOverlap(
          candidate,
          itemRect,
          WORD_GAP
        )
      ){

        blocked =
          true;

        break;

      }

    }


    if(
      !blocked
    ){

      return {

        x,

        y:topY

      };

    }

  }


  /*
    Fallback when the projection
    becomes very dense.
  */

  return {

    x:
      random(
        0,
        Math.max(
          1,
          spaceWidth -
          width
        )
      ),

    y:
      topY

  };

}



/* =========================================================
   ADD WORD
   ========================================================= */

function addWord(
  id,
  text,
  initial=false
){

  if(
    !text
  ){

    return;

  }


  empty.style.display =
    "none";


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "word";


  el.textContent =
    text;


  el.dataset.id =
    id;


  /*
    Set readable font size.
  */

  el.style.fontSize =
    getFontSize(text) +
    "px";


  space.appendChild(
    el
  );


  /*
    Measure actual dimensions.
  */

  const wordWidth =
    el.offsetWidth;


  const wordHeight =
    el.offsetHeight;


  /*
    Find open location.
  */

  const position =
    findOpenPosition(
      wordWidth,
      wordHeight,
      initial
    );


  const item = {

    id,

    el,

    x:
      position.x,

    y:
      position.y,

    /*
      One speed for everyone.
    */

    speed:
      FALL_SPEED,

    /*
      Individual pulse.
    */

    pulseOffset:
      random(
        0,
        Math.PI * 2
      ),

    pulseSpeed:
      random(
        0.0005,
        0.0010
      ),

    opacityBase:
      random(
        0.48,
        0.72
      )

  };


  words.push(
    item
  );


  wordItems.set(
    id,
    item
  );


  /*
    New confession appears
    a little stronger.
  */

  if(
    !initial
  ){

    item.opacityBase =
      0.82;

  }


  /*
    Moderation.
  */

  el.addEventListener(
    "click",
    () => {

      if(
        !adminUnlocked
      ){

        return;

      }


      selectConfession(
        id
      );

    }
  );


  /*
    Maximum of 150.
  */

  while(
    words.length >
    MAX_WORDS
  ){

    const old =
      words.shift();


    wordItems.delete(
      old.id
    );


    old.el.remove();

  }


  return item;

}



/* =========================================================
   SHOW SPACE
   ========================================================= */

function showSpace(){

  entry.classList.add(
    "hidden"
  );


  space.classList.add(
    "visible"
  );


  /*
    User has interacted, so try
    to start video with sound.
  */

  startVideo();

}



/* =========================================================
   SHOW ENTRY
   ========================================================= */

function showEntry(){

  space.classList.remove(
    "visible"
  );


  entry.classList.remove(
    "hidden"
  );


  input.focus();

}



/* =========================================================
   ENTER SHARED SPACE
   ========================================================= */

enterSpace.addEventListener(
  "click",
  () => {

    showSpace();

  }
);



/* =========================================================
   SUBMIT CONFESSION
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    /*
      Start video BEFORE the Firebase
      request so the browser sees this
      as part of the user's click.
    */

    startVideo();


    const text =
      input.value
        .trim()
        .replace(
          /\s+/g,
          " "
        );


    if(
      !text
    ){

      return;

    }


    release.disabled =
      true;


    status.textContent =
      "Releasing…";


    try{

      await push(
        confessionRef,
        {

          text,

          createdAt:
            Date.now()

        }
      );


      input.value =
        "";


      status.textContent =
        "";


      showSpace();


    }catch(error){

      console.error(
        "Submission error:",
        error
      );


      status.textContent =
        "Something went wrong. Try again.";


      release.disabled =
        false;

    }

  }
);



/* =========================================================
   BACK TO ENTRY
   ========================================================= */

back.addEventListener(
  "click",
  () => {

    showEntry();


    release.disabled =
      false;


    status.textContent =
      "";

  }
);



/* =========================================================
   FIREBASE: ADD
   ========================================================= */

onChildAdded(
  confessionRef,
  snapshot => {

    const data =
      snapshot.val();


    if(
      !data ||
      typeof data.text !==
      "string"
    ){

      return;

    }


    /*
      Existing confessions fill
      the projection.

      New confessions enter
      from the top.
    */

    const initial =
      !space.classList.contains(
        "visible"
      );


    addWord(
      snapshot.key,
      data.text,
      initial
    );

  }
);



/* =========================================================
   FIREBASE: REMOVE
   ========================================================= */

onChildRemoved(
  confessionRef,
  snapshot => {

    const id =
      snapshot.key;


    const item =
      wordItems.get(
        id
      );


    if(
      !item
    ){

      return;

    }


    item.el.remove();


    wordItems.delete(
      id
    );


    const index =
      words.indexOf(
        item
      );


    if(
      index !== -1
    ){

      words.splice(
        index,
        1
      );

    }


    if(
      selectedId === id
    ){

      selectedId =
        null;


      deleteButton.style.display =
        "none";

    }


    buildAdminList();

  }
);



/* =========================================================
   SELECT CONFESSION
   ========================================================= */

function selectConfession(
  id
){

  selectedId =
    id;


  wordItems.forEach(
    item => {

      item.el.classList.remove(
        "selected"
      );

    }
  );


  const item =
    wordItems.get(
      id
    );


  if(
    item
  ){

    item.el.classList.add(
      "selected"
    );

  }


  document
    .querySelectorAll(
      ".modItem"
    )
    .forEach(
      row => {

        row.classList.toggle(
          "selected",
          row.dataset.id === id
        );

      }
    );


  deleteButton.style.display =
    "block";

}



/* =========================================================
   ADMIN LIST
   ========================================================= */

function buildAdminList(){

  adminList.innerHTML =
    "";


  wordItems.forEach(
    (item,id) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "modItem";


      row.dataset.id =
        id;


      row.textContent =
        item.el.textContent;


      row.addEventListener(
        "click",
        () => {

          selectConfession(
            id
          );

        }
      );


      adminList.appendChild(
        row
      );

    }
  );

}



/* =========================================================
   MODERATION PANEL
   ========================================================= */

moderate.addEventListener(
  "click",
  () => {

    moderationPanel.classList.toggle(
      "open"
    );


    if(
      moderationPanel.classList.contains(
        "open"
      )
    ){

      adminPin.focus();


      if(
        adminUnlocked
      ){

        buildAdminList();

      }

    }

  }
);



/* =========================================================
   LOGIN
   ========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    if(
      adminPin.value ===
      ADMIN_PIN
    ){

      adminUnlocked =
        true;


      adminPin.value =
        "";


      adminList.style.display =
        "block";


      moderationStatus.textContent =
        "Moderation unlocked. Select a confession to delete it.";


      buildAdminList();


      wordItems.forEach(
        item => {

          item.el.classList.add(
            "moderatable"
          );

        }
      );


    }else{

      adminUnlocked =
        false;


      moderationStatus.textContent =
        "Incorrect PIN.";

    }

  }
);



/* =========================================================
   DELETE CONFESSION
   ========================================================= */

deleteButton.addEventListener(
  "click",
  async () => {

    if(
      !adminUnlocked
    ){

      moderationStatus.textContent =
        "Moderation is locked.";

      return;

    }


    if(
      !selectedId
    ){

      moderationStatus.textContent =
        "Select a confession first.";

      return;

    }


    const idToDelete =
      selectedId;


    const item =
      wordItems.get(
        idToDelete
      );


    if(
      !item
    ){

      moderationStatus.textContent =
        "That confession could not be found.";

      return;

    }


    if(
      !window.confirm(
        "Delete this confession from the shared space?"
      )
    ){

      return;

    }


    try{

      await remove(
        ref(
          database,
          "confessions/" +
          idToDelete
        )
      );


      selectedId =
        null;


      deleteButton.style.display =
        "none";


      moderationStatus.textContent =
        "Confession deleted.";


    }catch(error){

      console.error(
        "Delete error:",
        error
      );


      moderationStatus.textContent =
        "Delete failed. Check Firebase Rules.";

    }

  }
);



/* =========================================================
   CONTINUOUS FALLING ANIMATION
   ========================================================= */

let lastTime =
  performance.now();


function animate(
  currentTime
){

  const delta =
    currentTime -
    lastTime;


  lastTime =
    currentTime;


  const width =
    space.clientWidth;


  const height =
    space.clientHeight;


  words.forEach(
    item => {


      /*
        ---------------------------------
        FALL
        ---------------------------------
      */

      item.y +=
        item.speed *
        delta;



      /*
        ---------------------------------
        PULSE
        ---------------------------------
      */

      const pulse =
        Math.sin(
          currentTime *
          item.pulseSpeed +
          item.pulseOffset
        );


      let opacity =
        item.opacityBase +
        pulse * 0.10;



      /*
        ---------------------------------
        FADE IN
        ---------------------------------
      */

      if(
        item.y < 180
      ){

        const fadeIn =
          Math.max(
            0,
            Math.min(
              1,
              (
                item.y +
                120
              ) /
              300
            )
          );


        opacity *=
          fadeIn;

      }



      /*
        ---------------------------------
        FADE OUT
        ---------------------------------
      */

      if(
        item.y >
        height * .80
      ){

        const fadeOut =
          1 -
          (
            (
              item.y -
              height * .80
            ) /
            (
              height * .20
            )
          );


        opacity *=
          Math.max(
            0,
            Math.min(
              1,
              fadeOut
            )
          );

      }



      /*
        ---------------------------------
        OPACITY
        ---------------------------------
      */

      opacity =
        Math.max(
          0,
          Math.min(
            .90,
            opacity
          )
        );



      /*
        ---------------------------------
        POSITION
        ---------------------------------
      */

      item.el.style.transform =
        "translate(" +
        item.x +
        "px," +
        item.y +
        "px)";


      item.el.style.opacity =
        opacity;



      /*
        =================================================
        CONTINUOUS RECYCLING
        =================================================

        Once the confession has
        completely left the bottom,
        immediately place it above
        the top.

        It is NEVER deleted.
        =================================================
      */

      if(
        item.y >
        height + 20
      ){

        const wordWidth =
          item.el.offsetWidth;


        const wordHeight =
          item.el.offsetHeight;


        /*
          Find a new open location
          above the screen.
        */

        const position =
          findOpenPosition(
            wordWidth,
            wordHeight,
            false,
            item
          );


        item.x =
          position.x;


        item.y =
          position.y;


        /*
          Give it a new pulse.
        */

        item.pulseOffset =
          random(
            0,
            Math.PI * 2
          );


        item.pulseSpeed =
          random(
            0.0005,
            0.0010
          );


        /*
          Start invisible and fade
          back in.
        */

        item.el.style.opacity =
          0;

      }

    }
  );


  requestAnimationFrame(
    animate
  );

}



/* =========================================================
   START ANIMATION
   ========================================================= */

requestAnimationFrame(
  animate
);


</script>

</body>

</html>
