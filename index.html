<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Take Up Space</title>
<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{overflow:hidden}

#entry{
  position:relative;
  z-index:20;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:#f4f1ec;
  color:#171717;
  transition:opacity 1.2s ease, visibility 1.2s ease;
}

#entry.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.entry-inner{
  width:min(720px,100%);
}

h1{
  font-size:clamp(38px,7vw,76px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.055em;
  margin:0 0 22px;
  max-width:700px;
}

.intro{
  font-size:18px;
  line-height:1.45;
  max-width:580px;
  margin:0 0 28px;
}

textarea{
  width:100%;
  min-height:190px;
  resize:vertical;
  border:1px solid #171717;
  background:#fff;
  color:#171717;
  padding:18px;
  font:inherit;
  font-size:19px;
  line-height:1.35;
  outline:none;
}

textarea:focus{
  box-shadow:0 0 0 2px #171717;
}

.entry-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-top:12px;
}

button{
  border:0;
  background:#171717;
  color:#fff;
  padding:15px 25px;
  min-height:50px;
  font:inherit;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:default;
}

#status{
  font-size:14px;
  min-height:20px;
}

#space{
  position:absolute;
  inset:0;
  overflow:hidden;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.5s ease;
  background:#050505;
}

#space.visible{
  opacity:1;
  pointer-events:auto;
}

.word{
  position:absolute;
  left:0;
  top:0;
  max-width:34vw;
  color:#fff;
  font-size:clamp(19px,2.3vw,46px);
  line-height:1.02;
  font-weight:400;
  letter-spacing:-.035em;
  opacity:0;
  will-change:transform,opacity;
  pointer-events:none;
}

.word.appear{
  animation:appear 2s ease-out forwards;
}

@keyframes appear{
  from{
    opacity:0;
    transform:scale(.55);
  }
  to{
    opacity:.9;
  }
}

.word.fade{
  transition:opacity 3s ease;
  opacity:0!important;
}

#back{
  position:absolute;
  z-index:30;
  top:20px;
  left:20px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.35);
  color:#fff;
  padding:9px 13px;
  font-size:13px;
  opacity:.55;
}

#back:hover{opacity:1}

#empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:15px;
}

@media(max-width:600px){
  #entry{padding:22px}
  .entry-bottom{align-items:flex-end}
  button{width:100%}
  .word{max-width:58vw}
}
</style>
</head>

<body>

<section id="entry">
  <div class="entry-inner">
    <h1>What have you been taught to make yourself smaller about?</h1>

    <p class="intro">
      Write a confession. Once you release it, your words will enter the shared space with everyone else's.
    </p>

    <form id="form">
      <textarea id="input" maxlength="240" required
        placeholder="Write something..."></textarea>

      <div class="entry-bottom">
        <span id="status" aria-live="polite"></span>
        <button id="release" type="submit">Release</button>
      </div>
    </form>
  </div>
</section>

<section id="space" aria-label="Shared confession space">
  <div id="empty">The space is waiting.</div>
  <button id="back" type="button">Add another confession</button>
</section>

<script type="module">

/*
  ==========================================================
  FIREBASE SETUP
  ==========================================================

  Replace the values below with your Firebase Web App config.

  Firebase Console:
  Project settings → Your apps → Web app

  ==========================================================
*/

const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  databaseURL: "PASTE_DATABASE_URL",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_STORAGE_BUCKET",
  messagingSenderId: "PASTE_MESSAGING_SENDER_ID",
  appId: "PASTE_APP_ID"
};

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const confessionRef = ref(database, "confessions");

const entry = document.getElementById("entry");
const space = document.getElementById("space");
const form = document.getElementById("form");
const input = document.getElementById("input");
const release = document.getElementById("release");
const status = document.getElementById("status");
const back = document.getElementById("back");
const empty = document.getElementById("empty");

const words = [];
const MAX_WORDS = 80;

function random(min,max){
  return Math.random() * (max-min) + min;
}

function addWord(text, isNewSubmission=false){

  empty.style.display = "none";

  const el = document.createElement("div");
  el.className = "word appear";
  el.textContent = text;

  if(isNewSubmission){
    el.style.fontSize = "clamp(25px,3.2vw,64px)";
  }

  space.appendChild(el);

  const width = space.clientWidth;
  const height = space.clientHeight;

  const item = {
    el,
    x: random(30, Math.max(30,width-420)),
    y: random(30, Math.max(30,height-100)),
    vx: random(-.20,.20),
    vy: random(-.14,.14),
    rotation: random(-5,5),
    rotationSpeed: random(-.012,.012),
    scale: isNewSubmission ? 1.15 : random(.75,1.3)
  };

  words.push(item);

  if(words.length > MAX_WORDS){
    const old = words.shift();
    old.el.classList.add("fade");
    setTimeout(()=>old.el.remove(),3000);
  }

  return item;
}

function showSpace(){
  entry.classList.add("hidden");
  space.classList.add("visible");
}

function showEntry(){
  space.classList.remove("visible");
  entry.classList.remove("hidden");
  input.focus();
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  const text = input.value.trim().replace(/\s+/g," ");

  if(!text) return;

  release.disabled = true;
  status.textContent = "Releasing…";

  try{

    await push(confessionRef,{
      text,
      createdAt:Date.now()
    });

    input.value = "";
    status.textContent = "";

    showSpace();

  }catch(error){

    console.error(error);
    status.textContent = "Something went wrong. Try again.";
    release.disabled = false;
  }
});

back.addEventListener("click",()=>{
  showEntry();
  release.disabled = false;
  status.textContent = "";
});

onChildAdded(confessionRef, snapshot => {

  const data = snapshot.val();

  if(!data || typeof data.text !== "string") return;

  /*
    If this browser just submitted something, the newest
    confession still appears as part of the shared space.
  */
  addWord(data.text);

});

function animate(){

  const width = space.clientWidth;
  const height = space.clientHeight;

  words.forEach(item=>{

    const w = item.el.offsetWidth;
    const h = item.el.offsetHeight;

    item.x += item.vx;
    item.y += item.vy;
    item.rotation += item.rotationSpeed;

    if(item.x < -20 || item.x+w > width+20){
      item.vx *= -1;
    }

    if(item.y < -20 || item.y+h > height+20){
      item.vy *= -1;
    }

    item.x = Math.max(-20,Math.min(item.x,width-w+20));
    item.y = Math.max(-20,Math.min(item.y,height-h+20));

    item.el.style.transform =
      `translate(${item.x}px,${item.y}px)
       rotate(${item.rotation}deg)
       scale(${item.scale})`;

  });

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
