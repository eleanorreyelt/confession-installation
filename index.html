<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Take Up Space</title>


<style>

/* =========================================================
   BASIC
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  overflow:hidden;
  background:#192142;
}



/* =========================================================
   ENTRY PAGE
   ========================================================= */

#entry{
  position:relative;
  z-index:20;

  width:100%;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:30px;

  background:#f4f1ec;
  color:#171717;

  transition:
    opacity 1.2s ease,
    visibility 1.2s ease;
}

#entry.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.entry-inner{
  width:min(720px,100%);
}

h1{
  font-size:clamp(38px,7vw,76px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.055em;

  margin:0 0 22px;

  max-width:700px;
}

.intro{
  font-size:18px;
  line-height:1.45;

  max-width:580px;

  margin:0 0 28px;
}

textarea{
  width:100%;
  min-height:190px;

  resize:vertical;

  border:1px solid #171717;

  background:#fff;
  color:#171717;

  padding:18px;

  font:inherit;
  font-size:19px;
  line-height:1.35;

  outline:none;
}

textarea:focus{
  box-shadow:0 0 0 2px #171717;
}

.entry-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:16px;

  margin-top:12px;
}

button{
  border:0;

  background:#171717;
  color:#fff;

  padding:15px 25px;
  min-height:50px;

  font:inherit;

  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:default;
}

#status{
  font-size:14px;
  min-height:20px;
}

#enterSpace{
  margin-top:14px;

  background:transparent;

  border:1px solid #171717;

  color:#171717;

  padding:12px 18px;

  font-size:14px;
}

#enterSpace:hover{
  background:#171717;
  color:#fff;
}



/* =========================================================
   SHARED SPACE
   ========================================================= */

#space{
  position:absolute;
  inset:0;

  overflow:hidden;

  background:#192142;

  opacity:0;
  pointer-events:none;

  transition:opacity 1.5s ease;
}

#space.visible{
  opacity:1;
  pointer-events:auto;
}



/* =========================================================
   FALLING CONFESSIONS
   ========================================================= */

.word{
  position:absolute;

  left:0;
  top:0;

  color:#677AC5;

  /*
    Readable but not overwhelming.
  */

  font-size:clamp(
    21px,
    2vw,
    38px
  );

  line-height:1.08;

  font-weight:400;

  letter-spacing:-.035em;

  /*
    Long confessions wrap instead
    of shrinking.
  */

  white-space:normal;

  width:max-content;

  max-width:38vw;

  opacity:0;

  pointer-events:none;

  will-change:
    transform,
    opacity;

  transform-origin:center center;
}



/* =========================================================
   BACK BUTTON
   ========================================================= */

#back{
  position:absolute;

  z-index:30;

  top:20px;
  left:20px;

  border:
    1px solid
    rgba(
      103,
      122,
      197,
      .45
    );

  background:
    rgba(
      25,
      33,
      66,
      .8
    );

  color:#677AC5;

  padding:9px 13px;

  font-size:13px;

  opacity:.6;
}

#back:hover{
  opacity:1;
}



/* =========================================================
   EMPTY STATE
   ========================================================= */

#empty{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#677AC5;

  font-size:15px;

  opacity:.6;
}



/* =========================================================
   MODERATION BUTTON
   ========================================================= */

#moderate{
  position:absolute;

  z-index:50;

  top:20px;
  right:20px;

  border:
    1px solid
    rgba(
      103,
      122,
      197,
      .45
    );

  background:
    rgba(
      25,
      33,
      66,
      .8
    );

  color:#677AC5;

  padding:10px 14px;

  font-size:13px;
}



/* =========================================================
   MODERATION PANEL
   ========================================================= */

#moderationPanel{
  position:absolute;

  z-index:60;

  top:65px;
  right:20px;

  width:
    min(
      360px,
      calc(100% - 40px)
    );

  max-height:70vh;

  overflow:auto;

  background:#192142;

  border:
    1px solid #677AC5;

  padding:16px;

  display:none;

  color:#677AC5;
}

#moderationPanel.open{
  display:block;
}

#moderationPanel h2{
  font-size:16px;
  font-weight:400;

  margin:0 0 12px;
}

#adminLogin{
  display:flex;
  gap:8px;
}

#adminPin{
  flex:1;

  min-width:0;

  background:#192142;

  color:#677AC5;

  border:
    1px solid #677AC5;

  padding:10px;

  font:inherit;
}

#adminPin::placeholder{
  color:#677AC5;
  opacity:.6;
}

#loginButton,
#deleteButton{
  padding:10px 14px;
  min-height:42px;

  background:#677AC5;
  color:#192142;
}

#deleteButton{
  display:none;

  width:100%;

  margin-top:12px;
}

#moderationStatus{
  color:#677AC5;

  font-size:12px;
  line-height:1.35;

  margin-top:10px;

  opacity:.75;
}

#adminList{
  display:none;

  margin-top:12px;
}

.modItem{
  border-top:
    1px solid
    rgba(
      103,
      122,
      197,
      .35
    );

  padding:10px 6px;

  font-size:13px;
  line-height:1.3;

  cursor:pointer;

  color:#677AC5;
}

.modItem:hover{
  background:
    rgba(
      103,
      122,
      197,
      .1
    );
}

.modItem.selected{
  background:
    rgba(
      103,
      122,
      197,
      .2
    );
}

.word.moderatable{
  cursor:pointer;
  pointer-events:auto;
}

.word.selected{
  outline:
    1px solid #677AC5;

  outline-offset:7px;
}



/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  #entry{
    padding:22px;
  }

  .entry-bottom{
    align-items:flex-end;
  }

  button{
    width:100%;
  }

  #back,
  #moderate{
    width:auto;
  }

  .word{
    font-size:
      clamp(
        17px,
        4vw,
        27px
      );

    max-width:72vw;
  }

}

</style>

</head>


<body>


<!-- =======================================================
     ENTRY PAGE
     ======================================================= -->

<section id="entry">

  <div class="entry-inner">


    <h1>
      What have you been taught to make yourself smaller about?
    </h1>


    <p class="intro">
      Write a confession. Once you release it,
      your words will enter the shared space
      with everyone else's.
    </p>


    <form id="form">


      <textarea
        id="input"
        maxlength="500"
        required
        placeholder="Write something..."
      ></textarea>


      <div class="entry-bottom">


        <span
          id="status"
          aria-live="polite"
        ></span>


        <button
          id="release"
          type="submit"
        >
          Release
        </button>


      </div>


    </form>


    <button
      id="enterSpace"
      type="button"
    >
      Enter the shared space
    </button>


  </div>

</section>



<!-- =======================================================
     SHARED SPACE
     ======================================================= -->

<section
  id="space"
  aria-label="Shared confession space"
>


  <div id="empty">
    The space is waiting.
  </div>


  <button
    id="back"
    type="button"
  >
    Add another confession
  </button>


  <button
    id="moderate"
    type="button"
  >
    Moderate
  </button>


  <!-- =====================================================
       MODERATION
       ===================================================== -->

  <aside
    id="moderationPanel"
    aria-label="Moderation panel"
  >


    <h2>
      Moderation
    </h2>


    <div id="adminLogin">


      <input
        id="adminPin"
        type="password"
        placeholder="Admin PIN"
        autocomplete="off"
      >


      <button
        id="loginButton"
        type="button"
      >
        Enter
      </button>


    </div>


    <div id="moderationStatus">
      Enter the admin PIN to manage submissions.
    </div>


    <div id="adminList"></div>


    <button
      id="deleteButton"
      type="button"
    >
      Delete selected confession
    </button>


  </aside>

</section>



<script type="module">


/* =========================================================
   FIREBASE
   ========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBnzqy7qtsuGJEcKkXlW2CIy76ZwZu3uQ4",

  authDomain:
    "confession-installation.firebaseapp.com",

  databaseURL:
    "https://confession-installation-default-rtdb.firebaseio.com",

  projectId:
    "confession-installation",

  storageBucket:
    "confession-installation.firebasestorage.app",

  messagingSenderId:
    "715428481943",

  appId:
    "1:715428481943:web:49e9e0d3d3aaad7ef2d2d2",

  measurementId:
    "G-325RR1JKNW"

};


import {
  initializeApp
}
from
  "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  onChildRemoved,
  remove
}
from
  "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


const app =
  initializeApp(
    firebaseConfig
  );


const database =
  getDatabase(app);


const confessionRef =
  ref(
    database,
    "confessions"
  );



/* =========================================================
   ELEMENTS
   ========================================================= */

const entry =
  document.getElementById(
    "entry"
  );

const space =
  document.getElementById(
    "space"
  );

const form =
  document.getElementById(
    "form"
  );

const input =
  document.getElementById(
    "input"
  );

const release =
  document.getElementById(
    "release"
  );

const status =
  document.getElementById(
    "status"
  );

const enterSpace =
  document.getElementById(
    "enterSpace"
  );

const back =
  document.getElementById(
    "back"
  );

const empty =
  document.getElementById(
    "empty"
  );

const moderate =
  document.getElementById(
    "moderate"
  );

const moderationPanel =
  document.getElementById(
    "moderationPanel"
  );

const adminPin =
  document.getElementById(
    "adminPin"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const moderationStatus =
  document.getElementById(
    "moderationStatus"
  );

const adminList =
  document.getElementById(
    "adminList"
  );

const deleteButton =
  document.getElementById(
    "deleteButton"
  );



/* =========================================================
   MODERATION
   ========================================================= */

const ADMIN_PIN =
  "0092";

let adminUnlocked =
  false;

let selectedId =
  null;



/* =========================================================
   FALLING SETTINGS
   ========================================================= */


/*
  Keep the field relatively sparse.
*/

const MAX_WORDS =
  150;


/*
  Fewer columns means each confession
  gets more breathing room.
*/

const COLUMN_COUNT =
  10;


/*
  VERY SLOW.

  These are pixels per millisecond.

  Approximately 15–30 pixels per second.
*/

const FALL_SPEED_MIN =
  0.015;

const FALL_SPEED_MAX =
  0.030;


/*
  Minimum vertical gap between
  words in the same column.
*/

const WORD_GAP =
  180;


/*
  How much empty space is allowed
  above a newly recycled confession.
*/

const RECYCLE_GAP_MIN =
  250;

const RECYCLE_GAP_MAX =
  700;



/* =========================================================
   WORD STORAGE
   ========================================================= */

const words =
  [];

const wordItems =
  new Map();



/* =========================================================
   RANDOM
   ========================================================= */

function random(
  min,
  max
){

  return (
    Math.random() *
    (max - min)
  ) + min;

}



/* =========================================================
   FONT SIZE
   ========================================================= */

function getFontSize(
  text
){

  const length =
    text.length;


  /*
    Long confessions remain
    readable.
  */

  if(
    length > 400
  ){

    return random(
      21,
      24
    );

  }


  if(
    length > 300
  ){

    return random(
      23,
      27
    );

  }


  if(
    length > 200
  ){

    return random(
      25,
      30
    );

  }


  if(
    length > 120
  ){

    return random(
      28,
      33
    );

  }


  return random(
    31,
    40
  );

}



/* =========================================================
   FIND BEST COLUMN
   ========================================================= */

function getBestColumn(){

  const counts =
    new Array(
      COLUMN_COUNT
    ).fill(0);


  words.forEach(
    item => {

      counts[
        item.column
      ]++;

    }
  );


  let best =
    0;


  for(
    let i=1;
    i<COLUMN_COUNT;
    i++
  ){

    if(
      counts[i] <
      counts[best]
    ){

      best =
        i;

    }

  }


  return best;

}



/* =========================================================
   FIND HORIZONTAL POSITION
   ========================================================= */

function getColumnX(
  column,
  width
){

  const columnWidth =
    width /
    COLUMN_COUNT;


  return (
    column *
    columnWidth
  ) +
  random(
    20,
    Math.max(
      21,
      columnWidth - 80
    )
  );

}



/* =========================================================
   ADD WORD
   ========================================================= */

function addWord(
  id,
  text,
  initial=false
){

  if(
    !text
  ){

    return;

  }


  empty.style.display =
    "none";


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "word";


  el.textContent =
    text;


  el.dataset.id =
    id;


  /*
    Set readable font size.
  */

  el.style.fontSize =
    getFontSize(text) +
    "px";


  space.appendChild(
    el
  );


  const width =
    space.clientWidth;


  const height =
    space.clientHeight;


  /*
    Select the least populated
    column.
  */

  const column =
    getBestColumn();


  /*
    Put the confession somewhere
    within that column.
  */

  const x =
    getColumnX(
      column,
      width
    );


  /*
    Existing confessions are spread
    throughout the screen.

    New confessions begin above
    the projection.
  */

  let y;


  if(
    initial
  ){

    /*
      Divide the screen into
      generous vertical zones.
    */

    const zoneHeight =
      height /
      5;


    const zone =
      words.length %
      5;


    y =
      (
        zone *
        zoneHeight
      ) +
      random(
        20,
        Math.max(
          30,
          zoneHeight -
          120
        )
      );

  }else{

    y =
      -el.offsetHeight -
      random(
        200,
        600
      );

  }


  /*
    Look at words already occupying
    this column and make sure the
    new word has plenty of room.
  */

  const sameColumn =
    words.filter(
      item =>
        item.column ===
        column
    );


  if(
    sameColumn.length
  ){

    /*
      Find the word that is highest
      on the screen.
    */

    let closestToTop =
      Infinity;


    sameColumn.forEach(
      item => {

        if(
          item.y <
          closestToTop
        ){

          closestToTop =
            item.y;

        }

      }
    );


    if(
      !initial
    ){

      y =
        Math.min(
          y,
          closestToTop -
          WORD_GAP -
          el.offsetHeight
        );

    }

  }


  /*
    Individual speed.
  */

  const speed =
    random(
      FALL_SPEED_MIN,
      FALL_SPEED_MAX
    );


  /*
    Individual pulse rhythm.
  */

  const item = {

    id,

    el,

    column,

    x,

    y,

    speed,

    pulseOffset:
      random(
        0,
        Math.PI * 2
      ),

    pulseSpeed:
      random(
        0.0005,
        0.0010
      ),

    opacityBase:
      random(
        0.52,
        0.72
      )

  };


  words.push(
    item
  );


  wordItems.set(
    id,
    item
  );


  /*
    Moderation.
  */

  el.addEventListener(
    "click",
    () => {

      if(
        !adminUnlocked
      ){

        return;

      }


      selectConfession(
        id
      );

    }
  );


  /*
    Keep up to 150.
  */

  while(
    words.length >
    MAX_WORDS
  ){

    const old =
      words.shift();


    wordItems.delete(
      old.id
    );


    old.el.remove();

  }


  /*
    New submissions are slightly
    more visible.
  */

  if(
    !initial
  ){

    item.opacityBase =
      0.82;

  }


  return item;

}



/* =========================================================
   SHOW SPACE
   ========================================================= */

function showSpace(){

  entry.classList.add(
    "hidden"
  );

  space.classList.add(
    "visible"
  );

}



/* =========================================================
   SHOW ENTRY
   ========================================================= */

function showEntry(){

  space.classList.remove(
    "visible"
  );

  entry.classList.remove(
    "hidden"
  );

  input.focus();

}



/* =========================================================
   ENTER SHARED SPACE
   ========================================================= */

enterSpace.addEventListener(
  "click",
  () => {

    showSpace();

  }
);



/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const text =
      input.value
        .trim()
        .replace(
          /\s+/g,
          " "
        );


    if(
      !text
    ){

      return;

    }


    release.disabled =
      true;


    status.textContent =
      "Releasing…";


    try{

      await push(
        confessionRef,
        {

          text,

          createdAt:
            Date.now()

        }
      );


      input.value =
        "";


      status.textContent =
        "";


      showSpace();


    }catch(error){

      console.error(
        "Submission error:",
        error
      );


      status.textContent =
        "Something went wrong. Try again.";


      release.disabled =
        false;

    }

  }
);



/* =========================================================
   BACK TO ENTRY
   ========================================================= */

back.addEventListener(
  "click",
  () => {

    showEntry();


    release.disabled =
      false;


    status.textContent =
      "";

  }
);



/* =========================================================
   FIREBASE: ADD
   ========================================================= */

onChildAdded(
  confessionRef,
  snapshot => {

    const data =
      snapshot.val();


    if(
      !data ||
      typeof data.text !==
      "string"
    ){

      return;

    }


    /*
      Existing confessions are
      distributed across the space.

      New confessions enter
      from above.
    */

    const initial =
      !space.classList.contains(
        "visible"
      );


    addWord(
      snapshot.key,
      data.text,
      initial
    );

  }
);



/* =========================================================
   FIREBASE: REMOVE
   ========================================================= */

onChildRemoved(
  confessionRef,
  snapshot => {

    const id =
      snapshot.key;


    const item =
      wordItems.get(
        id
      );


    if(
      !item
    ){

      return;

    }


    item.el.remove();


    wordItems.delete(
      id
    );


    const index =
      words.indexOf(
        item
      );


    if(
      index !== -1
    ){

      words.splice(
        index,
        1
      );

    }


    if(
      selectedId === id
    ){

      selectedId =
        null;


      deleteButton.style.display =
        "none";

    }


    buildAdminList();

  }
);



/* =========================================================
   SELECT CONFESSION
   ========================================================= */

function selectConfession(
  id
){

  selectedId =
    id;


  wordItems.forEach(
    item => {

      item.el.classList.remove(
        "selected"
      );

    }
  );


  const item =
    wordItems.get(
      id
    );


  if(
    item
  ){

    item.el.classList.add(
      "selected"
    );

  }


  document
    .querySelectorAll(
      ".modItem"
    )
    .forEach(
      row => {

        row.classList.toggle(
          "selected",
          row.dataset.id ===
          id
        );

      }
    );


  deleteButton.style.display =
    "block";

}



/* =========================================================
   ADMIN LIST
   ========================================================= */

function buildAdminList(){

  adminList.innerHTML =
    "";


  wordItems.forEach(
    (item,id) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "modItem";


      row.dataset.id =
        id;


      row.textContent =
        item.el.textContent;


      row.addEventListener(
        "click",
        () => {

          selectConfession(
            id
          );

        }
      );


      adminList.appendChild(
        row
      );

    }
  );

}



/* =========================================================
   MODERATION PANEL
   ========================================================= */

moderate.addEventListener(
  "click",
  () => {

    moderationPanel.classList.toggle(
      "open"
    );


    if(
      moderationPanel.classList.contains(
        "open"
      )
    ){

      adminPin.focus();


      if(
        adminUnlocked
      ){

        buildAdminList();

      }

    }

  }
);



/* =========================================================
   ADMIN LOGIN
   ========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    if(
      adminPin.value ===
      ADMIN_PIN
    ){

      adminUnlocked =
        true;


      adminPin.value =
        "";


      adminList.style.display =
        "block";


      moderationStatus.textContent =
        "Moderation unlocked. Select a confession to delete it.";


      buildAdminList();


      wordItems.forEach(
        item => {

          item.el.classList.add(
            "moderatable"
          );

        }
      );


    }else{

      adminUnlocked =
        false;


      moderationStatus.textContent =
        "Incorrect PIN.";

    }

  }
);



/* =========================================================
   DELETE
   ========================================================= */

deleteButton.addEventListener(
  "click",
  async () => {

    if(
      !adminUnlocked
    ){

      moderationStatus.textContent =
        "Moderation is locked.";

      return;

    }


    if(
      !selectedId
    ){

      moderationStatus.textContent =
        "Select a confession first.";

      return;

    }


    const idToDelete =
      selectedId;


    const item =
      wordItems.get(
        idToDelete
      );


    if(
      !item
    ){

      moderationStatus.textContent =
        "That confession could not be found.";

      return;

    }


    if(
      !window.confirm(
        "Delete this confession from the shared space?"
      )
    ){

      return;

    }


    try{

      await remove(
        ref(
          database,
          "confessions/" +
          idToDelete
        )
      );


      selectedId =
        null;


      deleteButton.style.display =
        "none";


      moderationStatus.textContent =
        "Confession deleted.";


    }catch(error){

      console.error(
        "Delete error:",
        error
      );


      moderationStatus.textContent =
        "Delete failed. Check Firebase Rules.";

    }

  }
);



/* =========================================================
   CONTINUOUS FALLING ANIMATION
   ========================================================= */

let lastTime =
  performance.now();


function animate(
  currentTime
){

  const delta =
    currentTime -
    lastTime;


  lastTime =
    currentTime;


  const width =
    space.clientWidth;


  const height =
    space.clientHeight;


  words.forEach(
    item => {


      /*
        ---------------------------------
        SLOW FALL
        ---------------------------------
      */

      item.y +=
        item.speed *
        delta;



      /*
        ---------------------------------
        SOFT PULSE
        ---------------------------------
      */

      const pulse =
        Math.sin(
          currentTime *
          item.pulseSpeed +
          item.pulseOffset
        );


      let opacity =
        item.opacityBase +
        pulse * 0.10;



      /*
        ---------------------------------
        FADE IN
        ---------------------------------
      */

      if(
        item.y < 180
      ){

        const fadeIn =
          Math.max(
            0,
            Math.min(
              1,
              (
                item.y + 120
              ) /
              300
            )
          );


        opacity *=
          fadeIn;

      }



      /*
        ---------------------------------
        FADE OUT
        ---------------------------------
      */

      if(
        item.y >
        height * 0.78
      ){

        const fadeOut =
          1 -
          (
            (
              item.y -
              height * 0.78
            ) /
            (
              height * 0.22
            )
          );


        opacity *=
          Math.max(
            0,
            Math.min(
              1,
              fadeOut
            )
          );

      }



      /*
        ---------------------------------
        OPACITY LIMIT
        ---------------------------------
      */

      opacity =
        Math.max(
          0,
          Math.min(
            0.90,
            opacity
          )
        );



      /*
        ---------------------------------
        POSITION
        ---------------------------------
      */

      item.el.style.transform =
        "translate(" +
        item.x +
        "px," +
        item.y +
        "px)";


      item.el.style.opacity =
        opacity;



      /*
        =================================================
        RECYCLE
        =================================================

        The confession never gets deleted.

        It goes back above the screen
        and begins another slow fall.
        =================================================
      */

      if(
        item.y >
        height + 150
      ){

        /*
          Send it well above the
          visible area.

          This creates more separation
          between cycles.
        */

        item.y =
          -item.el.offsetHeight -
          random(
            RECYCLE_GAP_MIN,
            RECYCLE_GAP_MAX
          );


        /*
          New horizontal position.
        */

        item.x =
          random(
            20,
            Math.max(
              21,
              width -
              item.el.offsetWidth -
              20
            )
          );


        /*
          New speed.
        */

        item.speed =
          random(
            FALL_SPEED_MIN,
            FALL_SPEED_MAX
          );


        /*
          New pulse rhythm.
        */

        item.pulseOffset =
          random(
            0,
            Math.PI * 2
          );


        item.pulseSpeed =
          random(
            0.0005,
            0.0010
          );


        /*
          Start invisible so it
          fades in naturally.
        */

        item.el.style.opacity =
          0;

      }

    }
  );


  requestAnimationFrame(
    animate
  );

}



/* =========================================================
   START
   ========================================================= */

requestAnimationFrame(
  animate
);


</script>
