<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Take Up Space</title>


<style>

/* =========================================================
   BASIC
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  width:100%;

  height:100%;

  background:#fff;

  color:#171717;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

body{

  overflow:hidden;

}


/* =========================================================
   ENTRY SCREEN
   ========================================================= */

#entry{

  position:relative;

  z-index:20;

  width:100%;

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:30px;

  background:#f4f1ec;

  color:#171717;

  transition:
    opacity 1.2s ease,
    visibility 1.2s ease;

}

#entry.hidden{

  opacity:0;

  visibility:hidden;

  pointer-events:none;

}

.entry-inner{

  width:min(720px,100%);

}

h1{

  font-size:
    clamp(38px,7vw,76px);

  font-weight:400;

  line-height:.92;

  letter-spacing:-.055em;

  margin:0 0 22px;

  max-width:700px;

}

.intro{

  font-size:18px;

  line-height:1.45;

  max-width:580px;

  margin:0 0 28px;

}

textarea{

  width:100%;

  min-height:190px;

  resize:vertical;

  border:1px solid #171717;

  background:#fff;

  color:#171717;

  padding:18px;

  font:inherit;

  font-size:19px;

  line-height:1.35;

  outline:none;

}

textarea:focus{

  box-shadow:
    0 0 0 2px #171717;

}

.entry-bottom{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:16px;

  margin-top:12px;

}

button{

  border:0;

  background:#171717;

  color:#fff;

  padding:15px 25px;

  min-height:50px;

  font:inherit;

  cursor:pointer;

}

button:disabled{

  opacity:.45;

  cursor:default;

}

#status{

  font-size:14px;

  min-height:20px;

}


/* =========================================================
   ENTER SHARED SPACE
   ========================================================= */

#enterSpace{

  display:block;

  margin-top:18px;

  padding:0;

  min-height:auto;

  background:none;

  color:#171717;

  text-decoration:underline;

  font-size:14px;

}

#enterSpace:hover{

  opacity:.6;

}


/* =========================================================
   SHARED SPACE
   ========================================================= */

#space{

  position:absolute;

  inset:0;

  overflow:hidden;

  opacity:0;

  pointer-events:none;

  transition:opacity 1.5s ease;

  background:#fff;

}

#space.visible{

  opacity:1;

  pointer-events:auto;

}


/* =========================================================
   FLOATING CONFESSIONS
   ========================================================= */

.word{

  position:absolute;

  left:0;

  top:0;

  width:max-content;

  max-width:38vw;

  color:#171717;

  font-size:
    clamp(20px,2.1vw,38px);

  line-height:1.08;

  font-weight:400;

  letter-spacing:-.035em;

  white-space:normal;

  opacity:.9;

  will-change:transform;

  pointer-events:none;

}


/*
   Fade in when a confession appears.
*/

.word.appear{

  animation:
    wordAppear 1.5s ease forwards;

}

@keyframes wordAppear{

  from{

    opacity:0;

  }

  to{

    opacity:.9;

  }

}


/*
   Moderation mode.
*/

.word.moderatable{

  pointer-events:auto;

  cursor:pointer;

}

.word.selected{

  outline:
    1px solid
    rgba(23,23,23,.75);

  outline-offset:6px;

}


/*
   Old submissions fade out.
*/

.word.fade{

  transition:
    opacity 2s ease;

  opacity:0!important;

}


/* =========================================================
   TOP BUTTONS
   ========================================================= */

#back{

  position:absolute;

  z-index:30;

  top:20px;

  left:20px;

  border:
    1px solid
    rgba(23,23,23,.3);

  background:
    rgba(255,255,255,.9);

  color:#171717;

  padding:9px 13px;

  font-size:13px;

  opacity:.75;

}

#back:hover{

  opacity:1;

}


#moderate{

  position:absolute;

  z-index:50;

  right:20px;

  top:20px;

  border:
    1px solid
    rgba(23,23,23,.3);

  background:
    rgba(255,255,255,.9);

  color:#171717;

  padding:10px 14px;

  font-size:13px;

}


/* =========================================================
   EMPTY STATE
   ========================================================= */

#empty{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#777;

  font-size:15px;

}


/* =========================================================
   MODERATION PANEL
   ========================================================= */

#moderationPanel{

  position:absolute;

  z-index:60;

  right:20px;

  top:65px;

  width:
    min(
      360px,
      calc(100% - 40px)
    );

  max-height:70vh;

  overflow:auto;

  background:#fff;

  color:#171717;

  border:1px solid #171717;

  padding:16px;

  display:none;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.12);

}

#moderationPanel.open{

  display:block;

}

#moderationPanel h2{

  font-size:16px;

  font-weight:400;

  margin:0 0 12px;

}

#adminLogin{

  display:flex;

  gap:8px;

}

#adminPin{

  flex:1;

  min-width:0;

  background:#fff;

  color:#171717;

  border:1px solid #171717;

  padding:10px;

  font:inherit;

}

#loginButton,
#deleteButton{

  padding:10px 14px;

  min-height:42px;

}

#deleteButton{

  display:none;

  width:100%;

  margin-top:12px;

  background:#171717;

  color:#fff;

}

#moderationStatus{

  color:#666;

  font-size:12px;

  line-height:1.35;

  margin-top:10px;

}

#adminList{

  display:none;

  margin-top:12px;

}

.modItem{

  border-top:1px solid #ddd;

  padding:10px 6px;

  font-size:13px;

  line-height:1.3;

  cursor:pointer;

}

.modItem:hover{

  background:#f4f4f4;

}

.modItem.selected{

  background:#e9e9e9;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  #entry{

    padding:22px;

  }

  .entry-bottom{

    align-items:flex-end;

  }

  button{

    width:100%;

  }

  #enterSpace{

    width:auto;

  }

  .word{

    max-width:72vw;

    font-size:
      clamp(18px,5vw,30px);

  }

}

</style>

</head>


<body>


<!-- =======================================================
     ENTRY
     ======================================================= -->

<section id="entry">

  <div class="entry-inner">

    <h1>
      What have you been taught to make yourself smaller about?
    </h1>


    <p class="intro">
      Write a confession. Once you release it, your words will enter the shared space with everyone else's.
    </p>


    <form id="form">

      <textarea
        id="input"
        maxlength="500"
        required
        placeholder="Write something..."
      ></textarea>


      <div class="entry-bottom">

        <span
          id="status"
          aria-live="polite"
        ></span>


        <button
          id="release"
          type="submit"
        >
          Release
        </button>

      </div>

    </form>


    <button
      id="enterSpace"
      type="button"
    >
      Enter the shared space
    </button>

  </div>

</section>



<!-- =======================================================
     SHARED SPACE
     ======================================================= -->

<section
  id="space"
  aria-label="Shared confession space"
>

  <div id="empty">
    The space is waiting.
  </div>


  <button
    id="back"
    type="button"
  >
    Add another confession
  </button>


  <button
    id="moderate"
    type="button"
  >
    Moderate
  </button>



  <!-- =====================================================
       MODERATION
       ===================================================== -->

  <aside
    id="moderationPanel"
    aria-label="Moderation panel"
  >

    <h2>
      Moderation
    </h2>


    <div id="adminLogin">

      <input
        id="adminPin"
        type="password"
        placeholder="Admin PIN"
        autocomplete="off"
      >


      <button
        id="loginButton"
        type="button"
      >
        Enter
      </button>

    </div>


    <div id="moderationStatus">
      Enter the admin PIN to manage submissions.
    </div>


    <div id="adminList"></div>


    <button
      id="deleteButton"
      type="button"
    >
      Delete selected confession
    </button>

  </aside>

</section>



<script type="module">


/* =========================================================
   FIREBASE
   ========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBnzqy7qtsuGJEKkXlW2CIy76ZwZu3uQ4",

  authDomain:
    "confession-installation.firebaseapp.com",

  databaseURL:
    "https://confession-installation-default-rtdb.firebaseio.com",

  projectId:
    "confession-installation",

  storageBucket:
    "confession-installation.firebasestorage.app",

  messagingSenderId:
    "715428481943",

  appId:
    "1:715428481943:web:49e9e0d3d3aaad7ef2d2d2",

  measurementId:
    "G-325RR1JKNW"

};


import {
  initializeApp
}
from
  "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  onChildRemoved,
  remove
}
from
  "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


const app =
  initializeApp(firebaseConfig);


const database =
  getDatabase(app);


const confessionRef =
  ref(
    database,
    "confessions"
  );



/* =========================================================
   ELEMENTS
   ========================================================= */

const entry =
  document.getElementById("entry");

const space =
  document.getElementById("space");

const form =
  document.getElementById("form");

const input =
  document.getElementById("input");

const release =
  document.getElementById("release");

const status =
  document.getElementById("status");

const enterSpace =
  document.getElementById("enterSpace");

const moderate =
  document.getElementById("moderate");

const moderationPanel =
  document.getElementById(
    "moderationPanel"
  );

const adminPin =
  document.getElementById(
    "adminPin"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const moderationStatus =
  document.getElementById(
    "moderationStatus"
  );

const adminList =
  document.getElementById(
    "adminList"
  );

const deleteButton =
  document.getElementById(
    "deleteButton"
  );

const back =
  document.getElementById(
    "back"
  );

const empty =
  document.getElementById(
    "empty"
  );



/* =========================================================
   MODERATION
   ========================================================= */

const ADMIN_PIN =
  "0092";


let adminUnlocked =
  false;


let selectedId =
  null;


const wordItems =
  new Map();



/* =========================================================
   CONFESSION SETTINGS
   ========================================================= */

/*
   Maximum number of submissions
   visible at one time.
*/

const MAX_WORDS =
  500;


/*
   Number of horizontal lanes.

   More lanes means more space
   between submissions.
*/

const LANE_COUNT =
  10;


/*
   Track the next lane to use.
*/

let nextLane =
  0;


/*
   Track all animated submissions.
*/

const words = [];



/* =========================================================
   RANDOM
   ========================================================= */

function random(
  min,
  max
){

  return (
    Math.random() *
    (max - min)
  ) + min;

}



/* =========================================================
   FIND A LANE
   ========================================================= */

/*
   Instead of blindly assigning
   lanes, find the lane with the
   fewest active confessions.

   This prevents a single lane
   from becoming overloaded.
*/

function getBestLane(){

  const laneCounts =
    new Array(
      LANE_COUNT
    ).fill(0);


  words.forEach(
    item => {

      laneCounts[
        item.lane
      ]++;

    }
  );


  let bestLane =
    0;


  let lowestCount =
    laneCounts[0];


  for(
    let i = 1;
    i < LANE_COUNT;
    i++
  ){

    if(
      laneCounts[i] <
      lowestCount
    ){

      bestLane =
        i;

      lowestCount =
        laneCounts[i];

    }

  }


  return bestLane;

}



/* =========================================================
   ADD WORD
   ========================================================= */

function addWord(
  id,
  text,
  isNewSubmission = false
){

  empty.style.display =
    "none";


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "word appear";


  el.textContent =
    text;


  el.dataset.id =
    id;


  /*
     Give very long confessions
     slightly smaller text so
     they remain readable.
  */

  if(
    text.length > 350
  ){

    el.style.fontSize =
      "clamp(18px,1.7vw,31px)";

  }else if(
    text.length > 220
  ){

    el.style.fontSize =
      "clamp(19px,1.9vw,34px)";

  }


  /*
     Make a new submission
     slightly more prominent.
  */

  if(isNewSubmission){

    el.style.fontSize =
      "clamp(24px,2.8vw,48px)";

  }


  space.appendChild(
    el
  );


  const width =
    space.clientWidth;


  const height =
    space.clientHeight;


  /*
     Choose the least occupied lane.
  */

  const lane =
    getBestLane();


  /*
     Calculate lane height.

     Leave room at the top and
     bottom for the interface.
  */

  const topPadding =
    80;

  const bottomPadding =
    70;


  const usableHeight =
    Math.max(
      300,
      height -
      topPadding -
      bottomPadding
    );


  const laneHeight =
    usableHeight /
    LANE_COUNT;


  /*
     Slight variation inside
     each lane.
  */

  const y =
    topPadding +
    lane * laneHeight +
    laneHeight * .12;


  /*
     Find the furthest-right
     confession already in this lane.
  */

  const itemsInLane =
    words.filter(
      item =>
        item.lane === lane
    );


  let startX;


  if(
    itemsInLane.length === 0
  ){

    /*
       Empty lane.

       Spread initial submissions
       around the screen instead of
       putting them all at the left.
    */

    const offset =
      (
        wordItems.size *
        137
      ) %
      Math.max(
        400,
        width
      );


    startX =
      offset -
      250;

  }else{

    /*
       Existing confession in lane.

       Start the new one after
       the existing one.
    */

    const rightmost =
      Math.max(
        ...itemsInLane.map(
          item =>
            item.x +
            item.el.offsetWidth
        )
      );


    startX =
      rightmost +
      random(
        120,
        280
      );

  }


  /*
     Give each confession
     its own speed.
  */

  const speed =
    random(
      0.18,
      0.34
    );


  const item = {

    id,

    el,

    x:startX,

    y,

    speed,

    lane

  };


  words.push(
    item
  );


  wordItems.set(
    id,
    item
  );


  /*
     Click to select for moderation.
  */

  el.addEventListener(
    "click",
    () => {

      if(
        !adminUnlocked
      ){

        return;

      }


      selectConfession(
        id
      );

    }
  );


  if(
    adminUnlocked
  ){

    el.classList.add(
      "moderatable"
    );

  }


  /*
     Limit number of
     visible confessions.
  */

  if(
    words.length >
    MAX_WORDS
  ){

    const old =
      words.shift();


    wordItems.delete(
      old.id
    );


    old.el.classList.add(
      "fade"
    );


    setTimeout(
      () => {

        old.el.remove();

      },
      2000
    );

  }


  return item;

}



/* =========================================================
   SHOW SPACE
   ========================================================= */

function showSpace(){

  entry.classList.add(
    "hidden"
  );


  space.classList.add(
    "visible"
  );

}



/* =========================================================
   SHOW ENTRY
   ========================================================= */

function showEntry(){

  space.classList.remove(
    "visible"
  );


  entry.classList.remove(
    "hidden"
  );


  input.focus();

}



/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const text =
      input.value
        .trim()
        .replace(
          /\s+/g,
          " "
        );


    if(
      !text
    ){

      return;

    }


    release.disabled =
      true;


    status.textContent =
      "Releasing…";


    try{

      await push(
        confessionRef,
        {

          text,

          createdAt:
            Date.now()

        }
      );


      input.value =
        "";


      status.textContent =
        "";


      showSpace();


    }catch(error){

      console.error(
        error
      );


      status.textContent =
        "Something went wrong. Try again.";


      release.disabled =
        false;

    }

  }
);



/* =========================================================
   ENTER SPACE WITHOUT SUBMITTING
   ========================================================= */

enterSpace.addEventListener(
  "click",
  () => {

    showSpace();

  }
);



/* =========================================================
   BACK
   ========================================================= */

back.addEventListener(
  "click",
  () => {

    showEntry();


    release.disabled =
      false;


    status.textContent =
      "";

  }
);



/* =========================================================
   FIREBASE: ADD
   ========================================================= */

onChildAdded(
  confessionRef,
  snapshot => {

    const data =
      snapshot.val();


    if(
      !data ||
      typeof data.text !==
      "string"
    ){

      return;

    }


    addWord(
      snapshot.key,
      data.text
    );

  }
);



/* =========================================================
   FIREBASE: REMOVE
   ========================================================= */

onChildRemoved(
  confessionRef,
  snapshot => {

    const id =
      snapshot.key;


    const item =
      wordItems.get(
        id
      );


    if(item){

      item.el.remove();


      wordItems.delete(
        id
      );


      const index =
        words.indexOf(
          item
        );


      if(
        index !== -1
      ){

        words.splice(
          index,
          1
        );

      }

    }


    if(
      selectedId === id
    ){

      selectedId =
        null;


      deleteButton.style.display =
        "none";

    }


    buildAdminList();


    if(
      wordItems.size === 0
    ){

      empty.style.display =
        "flex";

    }

  }
);



/* =========================================================
   SELECT CONFESSION
   ========================================================= */

function selectConfession(
  id
){

  selectedId =
    id;


  wordItems.forEach(
    item => {

      item.el.classList.remove(
        "selected"
      );

    }
  );


  const item =
    wordItems.get(
      id
    );


  if(item){

    item.el.classList.add(
      "selected"
    );

  }


  document
    .querySelectorAll(
      ".modItem"
    )
    .forEach(
      row => {

        row.classList.toggle(
          "selected",
          row.dataset.id ===
          id
        );

      }
    );


  deleteButton.style.display =
    "block";

}



/* =========================================================
   MODERATION LIST
   ========================================================= */

function buildAdminList(){

  adminList.innerHTML =
    "";


  wordItems.forEach(
    (item,id) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "modItem";


      row.dataset.id =
        id;


      row.textContent =
        item.el.textContent;


      row.addEventListener(
        "click",
        () => {

          selectConfession(
            id
          );

        }
      );


      if(
        selectedId === id
      ){

        row.classList.add(
          "selected"
        );

      }


      adminList.appendChild(
        row
      );

    }
  );

}



/* =========================================================
   MODERATION BUTTON
   ========================================================= */

moderate.addEventListener(
  "click",
  () => {

    moderationPanel.classList.toggle(
      "open"
    );


    if(
      moderationPanel.classList.contains(
        "open"
      )
    ){

      if(
        adminUnlocked
      ){

        buildAdminList();

      }


      adminPin.focus();

    }

  }
);



/* =========================================================
   ADMIN LOGIN
   ========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    if(
      adminPin.value ===
      ADMIN_PIN
    ){

      adminUnlocked =
        true;


      adminPin.value =
        "";


      adminList.style.display =
        "block";


      moderationStatus.textContent =
        "Moderation unlocked. Select a confession to delete it.";


      buildAdminList();


      wordItems.forEach(
        item => {

          item.el.classList.add(
            "moderatable"
          );

        }
      );


    }else{

      moderationStatus.textContent =
        "Incorrect PIN.";


      adminUnlocked =
        false;

    }

  }
);



/* =========================================================
   ENTER KEY FOR PIN
   ========================================================= */

adminPin.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      loginButton.click();

    }

  }
);



/* =========================================================
   DELETE
   ========================================================= */

deleteButton.addEventListener(
  "click",
  async () => {

    if(
      !adminUnlocked
    ){

      moderationStatus.textContent =
        "Moderation is locked.";

      return;

    }


    if(
      !selectedId
    ){

      moderationStatus.textContent =
        "Select a confession first.";

      return;

    }


    const idToDelete =
      selectedId;


    const item =
      wordItems.get(
        idToDelete
      );


    if(!item){

      moderationStatus.textContent =
        "That confession could not be found.";

      return;

    }


    if(
      !window.confirm(
        "Delete this confession from the shared space?"
      )
    ){

      return;

    }


    try{

      await remove(
        ref(
          database,
          "confessions/" +
          idToDelete
        )
      );


      if(
        item.el
      ){

        item.el.remove();

      }


      wordItems.delete(
        idToDelete
      );


      const index =
        words.findIndex(
          word =>
            word.id ===
            idToDelete
        );


      if(
        index !== -1
      ){

        words.splice(
          index,
          1
        );

      }


      selectedId =
        null;


      deleteButton.style.display =
        "none";


      buildAdminList();


      moderationStatus.textContent =
        "Confession deleted.";


      if(
        wordItems.size === 0
      ){

        empty.style.display =
          "flex";

      }


    }catch(error){

      console.error(
        "Delete error:",
        error
      );


      moderationStatus.textContent =
        "Delete failed. Check your Firebase Database Rules.";

    }

  }
);



/* =========================================================
   LEFT → RIGHT ANIMATION
   ========================================================= */

function animate(){

  const width =
    space.clientWidth;


  words.forEach(
    item => {

      const wordWidth =
        item.el.offsetWidth;


      /*
         Slowly move right.
      */

      item.x +=
        item.speed;


      /*
         When the entire confession
         has left the screen, send it
         back to the far left.
      */

      if(
        item.x >
        width + 80
      ){

        item.x =
          -wordWidth -
          random(
            100,
            400
          );

      }


      /*
         Apply position.
      */

      item.el.style.transform =
        `translate(
          ${item.x}px,
          ${item.y}px
        )`;

    }
  );


  requestAnimationFrame(
    animate
  );

}


animate();


</script>
